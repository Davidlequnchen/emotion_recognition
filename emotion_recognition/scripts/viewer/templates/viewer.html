<!doctype html>
<!-- Template for scripts/viewer/make_viewer.py, which fills the JSON block near the end with the results and the selected clips. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emotion Recognition Results</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --line: rgba(11, 11, 11, 0.09); --hover: rgba(11, 11, 11, 0.03); --chip: #f0efec; --track: #ecebe7;
    --accent: #2a78d6; --accent-bg: rgba(42, 120, 214, 0.10);
    --good: #006300; --good-bg: rgba(12, 163, 12, 0.12); --bad: #b52f2f; --bad-bg: rgba(208, 59, 59, 0.11);
    --warn: #a86b00; --warn-bg: rgba(250, 178, 25, 0.34);
    /* Result levels: high (80% or more) green, middle (60 to 80%) amber, low (under 60%) red. The value keeps the
       ink colour on the level's tint; its table row gets a lighter tint of the same hue */
    --high-bg: rgba(12, 163, 12, 0.20); --mid-bg: var(--warn-bg); --low-bg: rgba(208, 59, 59, 0.19);
    --high-row: rgba(12, 163, 12, 0.06); --mid-row: rgba(250, 178, 25, 0.10); --low-row: rgba(208, 59, 59, 0.055);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
      --line: rgba(255, 255, 255, 0.09); --hover: rgba(255, 255, 255, 0.03); --chip: #2c2c2a; --track: #2c2c2a;
      --accent: #3987e5; --accent-bg: rgba(57, 135, 229, 0.18);
      --good: #3cc43c; --good-bg: rgba(12, 163, 12, 0.18); --bad: #f08080; --bad-bg: rgba(208, 59, 59, 0.22);
      --warn: #f2b84b; --warn-bg: rgba(250, 178, 25, 0.30);
      --high-bg: rgba(12, 163, 12, 0.36); --low-bg: rgba(208, 59, 59, 0.40);
      --high-row: rgba(12, 163, 12, 0.11); --mid-row: rgba(250, 178, 25, 0.08); --low-row: rgba(208, 59, 59, 0.12);
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1600px; margin: 0 auto; padding: 36px 16px 56px; }
  h1 { font-size: 24px; line-height: 1.2; margin: 0; }
  .sub { color: var(--ink-2); margin: 6px 0 24px; max-width: 72ch; }
  .sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }  /* for screen readers only */

  /* Tabs: Results, Examples, Datasets (the open tab is in the URL hash) */
  .tabs { display: flex; gap: 4px; margin: 0 0 28px; box-shadow: inset 0 -1px 0 var(--line); }
  .tab { font: inherit; font-weight: 600; color: var(--ink-2); background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 14px; cursor: pointer; white-space: nowrap; }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 6px 6px 0 0; }
  .panel:focus-visible { outline: 2px solid var(--accent); outline-offset: 6px; border-radius: 4px; }
  .panel > h2:first-child, #view-body > h2:first-child { margin-top: 0; }

  /* Summary tiles */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .tile.active { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .tile .label { color: var(--ink-2); font-size: 12px; }
  .tile .value { font-size: 24px; font-weight: 600; margin-top: 2px; }
  .tile .value .level { min-width: 0; padding: 0 8px; margin-left: -2px; }
  .tile .note { color: var(--muted); font-size: 12px; }

  /* Controls */
  .toolbar { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; margin-bottom: 12px; }
  .control { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--ink-2); max-width: 100%; }
  select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; max-width: 100%; }
  .seg { display: inline-flex; flex-wrap: wrap; max-width: 100%; background: var(--chip); border-radius: 9px; padding: 3px; gap: 2px; }
  .seg button { font: inherit; color: var(--ink-2); background: none; border: 0; border-radius: 7px; padding: 5px 12px; cursor: pointer; white-space: nowrap; }
  .seg button:hover:not(:disabled) { color: var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12); }
  .seg button:disabled { color: var(--muted); cursor: not-allowed; }
  .seg button:focus-visible, select:focus-visible, .play:focus-visible, .more:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .hint { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
  .hint .ok-hint { color: var(--good); }

  /* Table */
  /* position: relative keeps the hidden screen-reader texts (.sr) inside the scrolling card, not widening the page */
  .table-wrap { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow-x: auto; }
  table { width: 100%; min-width: 880px; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; font-weight: 600; color: var(--ink-2); padding: 12px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th small { display: block; font-weight: 400; color: var(--muted); }
  td { padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tbody tr.clip:hover { background: var(--hover); }
  tr.detail td { background: var(--page); padding: 14px 20px 18px 74px; }
  tbody:last-child tr:last-child td { border-bottom: 0; }

  .badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
  .badge.good { color: var(--good); background: var(--good-bg); }
  .badge.bad { color: var(--bad); background: var(--bad-bg); }
  .badge.none { color: var(--ink-2); background: var(--chip); }

  .clip-cell { display: flex; align-items: center; gap: 12px; min-width: 220px; }
  .play { flex: none; width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--ink); color: var(--surface); display: grid; place-items: center; cursor: pointer; }
  .play svg { width: 14px; height: 14px; fill: currentColor; }
  .file { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .meta { color: var(--muted); font-size: 12px; }
  .progress { height: 2px; border-radius: 1px; margin-top: 4px; overflow: hidden; }
  .progress i { display: block; height: 100%; width: 0; background: var(--accent); }

  .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--chip); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  .chip.pred { background: var(--accent-bg); font-weight: 600; }
  .chip .ok { color: var(--good); font-weight: 700; }
  .chip .no { color: var(--bad); font-weight: 700; }
  .conf { display: flex; align-items: center; gap: 8px; }
  .conf .bar { width: 72px; height: 6px; background: var(--track); border-radius: 0 3px 3px 0; }
  .conf .bar i { display: block; height: 100%; background: var(--accent); border-radius: 0 3px 3px 0; }
  .num { font-variant-numeric: tabular-nums; color: var(--ink-2); font-size: 12.5px; min-width: 3.4em; text-align: right; }
  .more { font: inherit; background: none; border: 1px solid var(--line); border-radius: 8px; color: var(--ink-2); width: 30px; height: 30px; cursor: pointer; }
  .more { display: grid; place-items: center; }
  .more svg { width: 14px; height: 14px; fill: currentColor; transition: transform 0.15s; }
  .more[aria-expanded="true"] { background: var(--chip); color: var(--ink); }
  .more[aria-expanded="true"] svg { transform: rotate(180deg); }

  /* Details of a clip: the model's probabilities, then every model's prediction */
  .probs { display: grid; grid-template-columns: max-content minmax(160px, 360px) 3.6em; gap: 5px 12px; align-items: center; font-size: 12.5px; color: var(--ink-2); }
  .probs .track { height: 8px; background: var(--track); border-radius: 0 4px 4px 0; }
  .probs .fill { height: 100%; background: #c3c2b7; border-radius: 0 4px 4px 0; }
  .probs .fill.pred { background: var(--accent); }
  .probs .rest, .detail .extra { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
  .detail .extra { margin-top: 10px; }
  .everyone { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-top: 14px; font-size: 12.5px; }
  .everyone > span:first-child { color: var(--ink-2); margin-right: 2px; }
  .everyone .chip { font-weight: 600; }
  .everyone .chip.current { box-shadow: inset 0 0 0 1px var(--accent); }
  .everyone .who { color: var(--ink-2); font-weight: 400; }

  .empty { color: var(--ink-2); padding: 28px; text-align: center; }

  /* Results: summary tables, confusion-matrix figure, datasets */
  h2 { font-size: 18px; line-height: 1.3; margin: 40px 0 4px; }
  h3 { font-size: 15px; margin: 28px 0 8px; }
  #view-control { margin-bottom: 24px; }
  table.results { min-width: 720px; }
  .results th, .results td { padding: 10px 14px; }
  .results th { white-space: normal; vertical-align: bottom; }
  .results th.model { min-width: 7.5em; }
  .results .n { text-align: right; font-variant-numeric: tabular-nums; }
  .results td.n { white-space: nowrap; }
  .results td.name { font-weight: 600; white-space: nowrap; }
  .results td.lang { white-space: nowrap; }
  /* The dataset column stays in view while a wide table scrolls inside its card (phones) */
  .results td.name, .results thead th:first-child { position: sticky; left: 0; z-index: 1; background-color: var(--surface); }
  .results .labels { min-width: 15em; }
  /* A group of rows (e.g. the datasets in the model's training data) under a header row */
  .results tr.group th { background: var(--page); color: var(--ink-2); padding: 8px 14px; border-top: 1px solid var(--line); }
  .results thead + tbody tr.group:first-child th { border-top: 0; }
  .results tr.group th span { display: inline-block; position: sticky; left: 14px; }
  .results a { color: var(--accent); }
  .results a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }

  /* Result levels: a tint behind the value (text stays in ink); a row of one model's table is lightly tinted */
  .lv-high { --lv: var(--high-bg); --lv-row: var(--high-row); --lv-edge: var(--good); }
  .lv-mid { --lv: var(--mid-bg); --lv-row: var(--mid-row); --lv-edge: var(--warn); }
  .lv-low { --lv: var(--low-bg); --lv-row: var(--low-row); --lv-edge: var(--bad); }
  .level { display: inline-block; min-width: 4.3em; padding: 2px 7px; border-radius: 6px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
  .level[class*="lv-"] { background: var(--lv); }
  .results tbody tr[class*="lv-"] td { background-image: linear-gradient(var(--lv-row), var(--lv-row)); }
  .dag { display: inline-block; width: 0.9em; text-align: left; padding-left: 2px; color: var(--ink-2); font-weight: 600; }
  .legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; color: var(--ink-2); font-size: 12.5px; margin: 0 0 10px; }
  .legend .key { display: inline-flex; align-items: center; gap: 6px; }
  .legend .swatch { width: 14px; height: 14px; border-radius: 4px; background: var(--lv); box-shadow: inset 0 0 0 1px var(--lv-edge); }
  .legend .dag { width: auto; padding: 0; }

  .notes { color: var(--ink-2); font-size: 12.5px; margin: 10px 0 0; padding-left: 18px; max-width: 92ch; }
  .notes li { margin: 3px 0; }
  .notes b { color: var(--ink); font-weight: 600; }
  .figure { margin: 0; background: #fcfcfb; border: 1px solid var(--line); border-radius: 12px; padding: 12px; overflow: auto; }
  .figure img { display: block; width: 100%; height: auto; cursor: zoom-in; }
  .figure.zoomed img { width: auto; max-width: none; cursor: zoom-out; }
  .figure:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .caption { color: var(--ink-2); font-size: 12.5px; margin: 8px 0 0; max-width: 92ch; }
  .caption + .legend { margin-top: 12px; }
  footer { color: var(--muted); font-size: 12px; margin-top: 24px; }
  code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
</style>
</head>
<body>
<main>
  <h1>Emotion recognition: results and examples</h1>
  <p class="sub" id="intro"></p>
  <div class="tabs" id="tabs" role="tablist" aria-label="Sections of this page">
    <button class="tab" id="tab-results" type="button" role="tab" aria-controls="panel-results" aria-selected="true">Results</button>
    <button class="tab" id="tab-examples" type="button" role="tab" aria-controls="panel-examples" aria-selected="false" tabindex="-1">Examples</button>
    <button class="tab" id="tab-datasets" type="button" role="tab" aria-controls="panel-datasets" aria-selected="false" tabindex="-1">Datasets</button>
  </div>
  <section class="panel" id="panel-results" role="tabpanel" aria-labelledby="tab-results" tabindex="0">
  <div class="toolbar" id="view-control">
    <div class="control">Model <div class="seg" id="view" role="group" aria-label="Model whose results are shown"></div></div>
  </div>
  <div id="view-body"></div>
  <div id="plots-body"></div>
  </section>
  <section class="panel" id="panel-examples" role="tabpanel" aria-labelledby="tab-examples" tabindex="0" hidden>
  <h2>Examples</h2>
  <p class="sub" id="sub"></p>
  <div class="toolbar">
    <label class="control" id="dataset-control">Dataset <select id="dataset"></select></label>
    <div class="control" id="model-control">Model <div class="seg" id="model" role="group" aria-label="Model whose predictions are shown"></div></div>
  </div>
  <div class="tiles" id="tiles"></div>
  <div class="toolbar">
    <div class="control" id="criterion-control">Correct when the prediction matches <div class="seg" id="criterion" role="group" aria-label="Correct when the prediction matches"></div></div>
    <div class="control">Show <div class="seg" id="status" role="group" aria-label="Clips to show"></div></div>
    <label class="control"><span id="truth-label">Ground truth</span> <select id="emotion"></select></label>
  </div>
  <p class="hint">Press play to listen. <b class="ok-hint">✓</b> marks the labels the prediction matches. The arrow at the end of a row shows the model's probabilities and every model's prediction for the clip.</p>
  <div class="table-wrap"><table>
    <thead><tr id="head"></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
  </section>
  <section class="panel" id="panel-datasets" role="tabpanel" aria-labelledby="tab-datasets" tabindex="0" hidden></section>
  <footer id="footer"></footer>
</main>

<script id="data" type="application/json">__DATA__</script>
<script>
  const DATA = JSON.parse(document.getElementById("data").textContent);
  // Results: the model shown ("all" = every model side by side) and the value in the comparison table.
  // Examples: the dataset (index in DATA.datasets), the model, and the filters, which stay when the model changes.
  const state = { view: "all", metric: "accuracy", plot: null, dataset: 0, model: null, criterion: null, status: "all", emotion: "all" };
  const MODELS = Object.fromEntries(DATA.models.map((m) => [m.key, m]));
  const $ = (id) => document.getElementById(id);
  const pretty = (key) => key.replace(/_/g, " ").replace(/^./, (c) => c.toUpperCase());
  const percent = (p) => `${(100 * p).toFixed(p >= 0.995 || p < 0.005 ? 0 : 1)}%`;
  // "a or b" is a tie; a composite label such as excited also matches the classes it accepts (accept: dataset.accept)
  const matches = (value, prediction, accept = {}) =>
    value.split(" or ").some((v) => v === prediction || (accept[v] ?? []).includes(prediction));
  const ICONS = { play: "M5 3.2v9.6L12.8 8z", pause: "M4 3h3v10H4zM9 3h3v10H9z", chevron: "M3.5 6l4.5 4.5L12.5 6l-1-1-3.5 3.5L4.5 5z" };

  // Create an element with properties (attrs: HTML attributes) and children; data is always inserted as text, never as HTML
  function el(tag, props = {}, ...children) {
    const { attrs = {}, ...rest } = props;
    const node = Object.assign(document.createElement(tag), rest);
    for (const [name, value] of Object.entries(attrs)) if (value !== undefined && value !== null) node.setAttribute(name, value);
    node.append(...children.filter((c) => c !== null && c !== undefined && c !== false));
    return node;
  }
  function icon(name) {
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 16 16");
    svg.setAttribute("aria-hidden", "true");
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", ICONS[name]);
    svg.append(path);
    return svg;
  }

  // One shared audio player; each row's button plays its clip
  const player = new Audio();
  let current = null;  // { button, bar } of the clip that is loaded
  function play(src, button, bar) {
    if (current?.button === button) { player.paused ? player.play() : player.pause(); return; }
    if (current) { current.button.replaceChildren(icon("play")); current.bar.style.width = "0"; }
    current = { button, bar };
    player.src = src;
    player.play();
  }
  player.addEventListener("play", () => current?.button.replaceChildren(icon("pause")));
  player.addEventListener("pause", () => current?.button.replaceChildren(icon("play")));
  player.addEventListener("timeupdate", () => { if (current && player.duration) current.bar.style.width = `${100 * player.currentTime / player.duration}%`; });

  // Toggle buttons, one pressed. options: [value, text, why it is disabled (if it is)]. A re-render keeps the
  // keyboard focus on the same option.
  function segmented(container, options, active, onPick) {
    const focused = container.contains(document.activeElement) ? document.activeElement.dataset.value : null;
    container.replaceChildren(...options.map(([value, text, off]) => {
      const b = el("button", { type: "button", textContent: text, disabled: Boolean(off), title: off || "", onclick: () => onPick(value) });
      b.dataset.value = value;
      b.setAttribute("aria-pressed", String(value === active));
      return b;
    }));
    if (focused !== null) [...container.children].find((b) => b.dataset.value === focused && !b.disabled)?.focus();
  }

  // ---- Examples: the clips of one dataset, shared by the models, with the prediction of one model ----
  const exampleModels = DATA.models.filter((m) => DATA.datasets.some((d) => d.runs[m.key]));
  // Whether a model got a clip right (under the chosen criterion): true, false, or null if its run lacks the clip
  const verdict = (result) => result ? (result.correct[state.criterion] ?? Object.values(result.correct)[0]) : null;

  function probabilities(clip, result, ds) {
    const truth = clip.labels[ds.ground_truth];
    const accepted = ds.accept?.[truth] ?? [];  // the classes a composite ground truth such as excited accepts
    const prediction = result.predictions.prediction;
    const sorted = Object.entries(result.probs).sort((a, b) => b[1] - a[1]);
    const keep = sorted.filter(([name, p]) => p >= 0.01 || name === truth || accepted.includes(name) || name === prediction);
    const grid = el("div", { className: "probs" });
    for (const [name, p] of keep) {
      grid.append(
        el("span", { textContent: name === truth ? `${name} (ground truth)` : accepted.includes(name) ? `${name} (accepted for ${truth})` : name }),
        el("div", { className: "track" }, el("div", { className: `fill${name === prediction ? " pred" : ""}`, style: `width: ${100 * p}%` })),
        el("span", { className: "num", textContent: percent(p) }));
    }
    if (sorted.length > keep.length) grid.append(el("span", { className: "rest", textContent: `${sorted.length - keep.length} other classes below 1%` }));
    return grid;
  }

  // Every model's prediction for one clip, with ✓ or ✗; the model of the table is outlined
  function everyModel(clip, ds) {
    return el("div", { className: "everyone" }, el("span", { textContent: "Every model:" }),
      ...exampleModels.filter((m) => ds.runs[m.key]).map((m) => {
        const result = clip.models[m.key], ok = verdict(result);
        return el("span", { className: `chip${m.key === state.model ? " current" : ""}` },
          el("span", { className: "who", textContent: m.name }), result ? result.predictions.prediction : "–",
          ok === null ? el("span", { className: "who", textContent: "(not in its results)" })
            : el("span", { className: ok ? "ok" : "no", textContent: ok ? "✓" : "✗", attrs: { "aria-hidden": "true" } }),
          ok === null ? null : el("span", { className: "sr", textContent: ok ? "correct" : "wrong" }));
      }));
  }

  function rows(clip, ds, labelKeys) {
    const result = clip.models[state.model];
    const ok = verdict(result);
    const button = el("button", { className: "play", type: "button", title: "Play or pause", attrs: { "aria-label": `Play ${clip.file}` } }, icon("play"));
    const bar = el("i");
    button.addEventListener("click", () => play(clip.audio, button, bar));
    const prediction = result?.predictions.prediction;
    // The prediction is the most probable of the dataset's emotions; the model's overall top class may differ
    const top = result ? Object.entries(result.predictions).find(([k]) => k !== "prediction")?.[1] : undefined;
    const p = result?.probs[prediction];
    const toggle = el("button", { className: "more", type: "button", title: "Show the probabilities and every model's prediction",
      attrs: { "aria-expanded": "false", "aria-label": `Details of ${clip.file}` } }, icon("chevron"));
    const dash = () => el("span", { className: "meta", textContent: "–" });

    const tr = el("tr", { className: "clip" },
      el("td", {}, el("span", { className: `badge ${ok === null ? "none" : ok ? "good" : "bad"}`, textContent: ok === null ? "– No result" : ok ? "✓ Correct" : "✗ Wrong" })),
      el("td", {}, el("div", { className: "clip-cell" }, button,
        el("div", {}, el("div", { className: "file", textContent: clip.file }),
          el("div", { className: "meta", textContent: clip.duration ? `${clip.duration.toFixed(1)} s` : "" }),
          el("div", { className: "progress" }, bar)))),
      ...labelKeys.map((key) => el("td", {}, clip.labels[key]
        ? el("span", { className: "chip" }, clip.labels[key], prediction && matches(clip.labels[key], prediction, ds.accept) ? el("span", { className: "ok", textContent: "✓", title: "the prediction matches this label" }) : null)
        : dash())),

  function renderExamples() {

    $("tiles").replaceChildren(
      ...run.criteria.map((c) => el("div", { className: `tile${c.column === state.criterion ? " active" : ""}` },

  // A new dataset keeps the model (if it has results there) and the filters that still apply
  function selectDataset(index) {

  }

  // ---- Results: every model side by side, or one model's summary (reports/<model>/summary.json) ----
  const pct = (x) => (typeof x !== "number") ? "–" : `${(100 * x).toFixed(1)}%`;
  // Level of a result, judged on the value as printed: high 80% or more, middle 60 to 80%, low under 60%
  function level(x) {

  }
  const sampleOf = (d) => d.total_clips > d.clips ? ` of ${d.total_clips.toLocaleString()}` : "";
  // Ground-truth labels in the order of the confusion-matrix rows; a composite label names the classes it accepts
  const labelText = (d) => d.labels?.length ? d.labels.map((x) => d.accept?.[x] ? `${x} (${d.accept[x].join(" or ")})` : x).join(", ") : "–";

    return el("div", { className: "table-wrap" }, el("table", { className: "results", attrs: { "aria-label": label } },
      el("thead", {}, el("tr", {}, ...columns.map(([text, cls]) => el("th", { className: cls ?? "", textContent: text, attrs: { scope: "col" } })))),

        ...trs))));
  }
  // Rows split into the datasets in the model's training data (first) and the others, each from the best value down
  function byTraining(model, items, value) {
    const sort = (list) => [...list].sort((a, b) => (value(b) ?? -1) - (value(a) ?? -1));

  const METRICS = [["accuracy", "Accuracy: acted emotion"], ["unweighted_accuracy", "Unweighted accuracy"], ["macro_f1", "Macro F1"]];
  function comparison(models) {
    const keys = [...new Set(models.flatMap((m) => m.summary.datasets.map((d) => d.key)))];
    const datasets = keys.map((key) => {
      const results = models.map((m) => m.summary.datasets.find((d) => d.key === key));

    });
    const values = (row) => row.results.map((d) => d?.metrics?.[state.metric]).filter((x) => typeof x === "number");
    const mean = (row) => values(row).length ? values(row).reduce((a, b) => a + b, 0) / values(row).length : -1;
    const cell = (d, m) => {
      if (!d) return el("td", { className: "n", title: `No results of ${m.name} on this dataset` }, el("span", { className: "level", textContent: "–" }), el("span", { className: "dag" }));
      const notes = [d.in_training_data ? `in ${m.name}'s training data` : "", d.total_clips > d.clips ? `on a sample of ${d.clips.toLocaleString()} of ${d.total_clips.toLocaleString()} clips` : ""].filter(Boolean);

          el("tr", {}, el("td", { className: "name", textContent: r.first.dataset }), td(r.first.language, "lang"),

  function modelResults(m) {

        td(pct(d.chance ?? 1 / d.emotions), "n"), el("td", { className: "n" }, levelValue(d.metrics.accuracy)),
        ...(listeners ? [td(pct(d.metrics.accuracy_acted_or_listener), "n")] : []), td(pct(d.metrics.unweighted_accuracy), "n"),

      composite.length ? el("li", { textContent: `Composite labels (no model class; a prediction of any class in brackets counts as correct): ${composite.join(", ")}. Chance level counts these classes, so it is higher than 1 in the number of emotions.` }) : null,

            el("td", { className: "n" }, levelValue(d.accuracy)), td(pct(d.unweighted_accuracy), "n")]))]),

  }

  const resultModels = DATA.models.filter((m) => m.summary);

  // ---- Tabs: the open tab is in the URL hash (#results, #examples, #datasets), so a tab can be linked and the

  const TABS = ["results", "examples", "datasets"];

  const names = DATA.models.map((m) => m.name);
  $("intro").textContent = names.length > 1
    ? `Speech emotion recognition with ${names.length} models (${names.join(", ")}): their results on every evaluated dataset, random clips they got right and wrong, and where the datasets come from.`
    : `Speech emotion recognition with ${names[0] ?? "a model"}: its results on every evaluated dataset, random clips it got right and wrong, and where the datasets come from.`;
  renderResults();
  renderPlots();
  $("panel-datasets").replaceChildren(...renderDatasets());
  $("dataset").replaceChildren(...DATA.datasets.map((d, i) => el("option", { value: i, textContent: d.dataset })));
  $("dataset-control").hidden = DATA.datasets.length < 2;
  $("model-control").hidden = exampleModels.length < 2;
  $("dataset").addEventListener("change", (e) => selectDataset(Number(e.target.value)));
  $("emotion").addEventListener("change", (e) => { state.emotion = e.target.value; renderExamples(); });
  $("footer").append("Generated by ", el("code", { textContent: "scripts/viewer/make_viewer.py" }),
    ". To get the same clips again, set ", el("code", { textContent: `seed: ${DATA.seed}` }), " in ",
    el("code", { textContent: "config/viewer.yaml" }), ".");
  $("tab-examples").hidden = !DATA.datasets.length;
  $("tab-datasets").hidden = !Object.keys(DATA.sources).length;
  if (DATA.datasets.length) {
    state.model = exampleModels[0].key;
    selectDataset(0);
  }
  showTab(tabInHash());
</script>
</body>
</html>
