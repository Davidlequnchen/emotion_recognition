# Publish the public results page of the emotion recognition project, emotion_recognition/site/index.html (built by
# emotion_recognition/scripts/viewer/make_viewer.py), with GitHub Pages.
# Only the emotion_recognition/site/ folder is published. Turn it on once: repository Settings > Pages > Source:
# GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
    paths: ["emotion_recognition/site/**"]
  workflow_dispatch:  # run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: emotion_recognition/site  # only the page: the repository also holds large dataset files
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: emotion_recognition/site
      - id: deployment
        uses: actions/deploy-pages@v5
