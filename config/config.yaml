# =====================================================================
# Project configuration. Every script reads its settings from this file
# (there are no command-line options): edit a value, then run
# `python scripts/<name>.py`.
# =====================================================================

# Hardware mode
#   mac  : Apple Silicon MacBook (e.g. M4 Max) -> Apple GPU via Metal (MPS), or CPU
#   cuda : Linux server with NVIDIA GPU(s)     -> CUDA 12.1 build of PyTorch
mode: mac

# Device used by each mode to run the model. Set it to "cpu" to force the CPU.
devices:
  mac: mps        # mps | cpu
  cuda: cuda:0    # cuda:<gpu index> | cpu

# Active model: one of the keys under `models`.
model: emotion2vec_plus_large

# Model registry: one entry here and one sub-folder in models/ per model.
models:
  emotion2vec_plus_large:
    dir: models/emotion2vec_plus_large
    hf_repo: emotion2vec/emotion2vec_plus_large   # HuggingFace
    ms_repo: iic/emotion2vec_plus_large           # ModelScope
  # Placeholder: register more models the same way, e.g.
  # emotion2vec_plus_base:
  #   dir: models/emotion2vec_plus_base
  #   hf_repo: emotion2vec/emotion2vec_plus_base
  #   ms_repo: iic/emotion2vec_plus_base

# ---------------------------------------------------------------------
# scripts/download_model.py and scripts/download_data.py
# ---------------------------------------------------------------------
download:
  hub: hf           # where download_model.py gets the active model: hf (Hugging Face) | ms (ModelScope, faster in mainland China)
  dataset: crema_d  # what download_data.py gets: crema_d | mcae_spps | thai_ser | nemo | mess | esd | all
  crema_d: samples  # CREMA-D only: samples (the 6 test clips) | full (all 7,442 clips and label files)
  workers: 8        # parallel downloads

# ---------------------------------------------------------------------
# scripts/inference.py
# ---------------------------------------------------------------------
inference:
  audio: data/samples   # a folder (every audio file in it) or a single file

# ---------------------------------------------------------------------
# scripts/evaluate.py
# ---------------------------------------------------------------------
evaluation:
  datasets: all     # all downloaded datasets, or a list such as [crema_d, nemo]
                    # (crema_d | mcae_spps | thai_ser | nemo | mess | esd)
  limit: null       # only N clips of each dataset, taken at even intervals (quick test or sample); null = every clip
  devices:          # device per mode for evaluation
    mac: cpu        # on the Mac the CPU is faster than MPS here: MPS compiles new kernels for every new clip length
    cuda: cuda:0
  summary_acted_or_listener: [crema_d]  # in the summary figure, these datasets show the confusion matrix where the
                                        # listeners' vote also counts as correct; the others show the acted emotion

# ---------------------------------------------------------------------
# scripts/make_viewer.py: a web page with random clips the model got right and wrong
# ---------------------------------------------------------------------
viewer:
  predictions: all  # all = every outputs/*_predictions.csv, or a list of such files
  correct: 10       # how many correctly predicted clips to show (per dataset and model)
  wrong: 10         # how many wrongly predicted clips to show
  seed: null        # a number gives the same selection every time; null picks new clips on each run
  link_audio: false # true = link to the audio files instead of embedding them (smaller page, works only in this repo)
  out: outputs/viewer.html
