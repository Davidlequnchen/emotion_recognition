# =====================================================================
# Model registry: one entry here and one sub-folder in models/ per model (an API model has no folder).
# Read by scripts/evaluation/evaluate.py, scripts/common/download_model.py and scripts/viewer/make_viewer.py
# (the summaries and the results page list the models in this order). Run them from the emotion_recognition/
# folder, e.g. `python scripts/evaluation/evaluate.py`; paths in this file are relative to that folder.
#   name            : display name in the reports and on the results page
#   loader          : the code that runs it, scripts/models/<loader>.py
#   dir             : where its files are (not for API models)
#   hf_repo         : the Hugging Face repository it comes from (ms_repo: ModelScope, if it is there too)
#   training_data   : the evaluation datasets it was trained on, so its results there are optimistic
#   training_source : what its training data was, in a few words (shown next to training_data)
#   mac_device      : (optional) its device on the Mac, when it differs from devices.mac in config/evaluation.yaml
#   limit           : (optional) N clips of each dataset for this model; overrides `limit` in config/evaluation.yaml
#   skip            : (optional) files of the repository that download_model.py leaves out (not needed here)
#   licence         : (optional) the licence of the weights, from the model card
# Open-weight audio LLMs, run here like the other local models (free; on the Mac and on CUDA), answering in text:
#   llm             : true: scored like the API models (an answer that is none of the dataset's emotions, or no
#                     readable answer, counts as wrong; training data "not known"), with the prompts of
#                     scripts/llm_eval/prompts.yaml (config/llm.yaml)
# Audio LLMs, called through their APIs (paid; they run only with `api_models: true` in config/evaluation.yaml):
#   api             : true: the model is called through an API, so it has no folder (no dir) and nothing to download
#   api_model       : the model name sent to the API
# =====================================================================
emotion2vec_plus_large:
  name: emotion2vec+ large
  loader: emotion2vec
  dir: models/emotion2vec_plus_large
  hf_repo: emotion2vec/emotion2vec_plus_large
  ms_repo: iic/emotion2vec_plus_large
  training_data: [crema_d, ravdess, tess, jl_corpus, esd, mead, meld, emovo, emozionalmente, savee]
  training_source: EmoBox (through emotion2vec+ seed)
  mac_device: cpu   # MPS compiles new kernels for every new clip length, so the CPU is faster
meralion_ser_v1:
  name: MERaLiON-SER-v1
  loader: meralion_ser
  dir: models/meralion_ser_v1
  hf_repo: MERaLiON/MERaLiON-SER-v1
  training_data: [crema_d, esd, meld]
  training_source: CREMA-D, ESD, MELD, M3ED and Singaporean speech
melati_emotion:
  name: Melati
  loader: melati
  dir: models/melati_emotion
  hf_repo: Scicom-intl/Melati-Emotion-Whisper-Large-V3
  training_data: [jl_corpus, emozionalmente]
  training_source: nine acted corpora, JL-Corpus among them
vox_profile_whisper:
  name: Vox-Profile Whisper
  loader: vox_profile
  dir: models/vox_profile_whisper
  hf_repo: tiantiaf/whisper-large-v3-msp-podcast-emotion
  training_data: []
  training_source: MSP-Podcast
vox_profile_wavlm:
  name: Vox-Profile WavLM
  loader: vox_profile
  dir: models/vox_profile_wavlm
  hf_repo: tiantiaf/wavlm-large-categorical-emotion
  training_data: []
  training_source: MSP-Podcast
qwen2_5_omni_7b:
  name: Qwen2.5-Omni 7B
  loader: qwen2_5_omni  # its Thinker only (text output), 8.93B parameters; bfloat16
  dir: models/qwen2_5_omni_7b
  hf_repo: Qwen/Qwen2.5-Omni-7B
  ms_repo: Qwen/Qwen2.5-Omni-7B
  licence: Apache-2.0
  llm: true
  skip: [spk_dict.pt]   # the Talker's voices (speech output is not used)
  training_data: []
  training_source: not published (Alibaba)
qwen2_audio_7b:
  name: Qwen2-Audio 7B Instruct
  loader: qwen2_audio   # 8.40B parameters; bfloat16
  dir: models/qwen2_audio_7b
  hf_repo: Qwen/Qwen2-Audio-7B-Instruct
  ms_repo: Qwen/Qwen2-Audio-7B-Instruct
  licence: Apache-2.0
  llm: true
  training_data: []
  training_source: not published (Alibaba)
gemma4_e4b:
  name: Gemma 4 E4B
  loader: gemma4_audio  # 8.00B parameters (4.5B effective); bfloat16; needs PyTorch >= 2.6
  dir: models/gemma4_e4b
  hf_repo: google/gemma-4-E4B-it
  ms_repo: google/gemma-4-E4B-it
  licence: Apache-2.0
  llm: true
  training_data: []
  training_source: not published (Google)
gpt_realtime:
  name: GPT Realtime
  loader: gpt_realtime
  api: true
  api_model: gpt-realtime
  training_data: []
  training_source: not published (OpenAI)
gemini:
  name: Gemini
  loader: gemini    # a placeholder for now: skipped with a message
  api: true
  api_model: gemini-3.8-flash  # the Gemini model used for the paper (confirmed by the user, 2026-11-06)
  training_data: []
  training_source: not published (Google)
