melati_emotion:
  name: Melati
  loader: melati
  dir: models/melati_emotion
  hf_repo: Scicom-intl/Melati-Emotion-Whisper-Large-V3
  training_data: [jl_corpus, emozionalmente, nemo]
  training_exposure:
    nemo:
      status: confirmed_exposure
      scope: author_development_calibration_not_applied
      reason: The author used nEMO to tune podcast thresholds, but did not fit the public SER head on it; this project uses
        raw argmax and does not apply those thresholds. Counted as seen in the broader development pipeline; the scope is calibration, not weight fitting.
      evidence:
      - https://huggingface.co/Scicom-intl/Melati-Emotion-Whisper-Large-V3/blob/145f4eb05d07dc4d06352132787a8b4f836e7710/README.md
  training_source: Public SER head trained on nine named corpora including JL-Corpus and Emozionalmente; Whisper-v3 pretraining incompletely disclosed; author nEMO threshold calibration is counted as seen development use, although its thresholds are not applied here
  training_evidence:
    - https://huggingface.co/Scicom-intl/Melati-Emotion-Whisper-Large-V3/blob/145f4eb05d07dc4d06352132787a8b4f836e7710/README.md
