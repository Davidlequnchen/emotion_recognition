name: Mirror PyTorch CUDA wheels
run-name: Mirror PyTorch ${{ inputs.cuda }} wheels

on:
  workflow_dispatch:
    inputs:
      cuda:
        description: PyTorch CUDA build
        type: choice
        required: true
        default: cu118
        options:
          - cu118
          - cu128

permissions:
  contents: write

concurrency:
  group: torch-${{ inputs.cuda }}-wheel-release
  cancel-in-progress: false

jobs:
  mirror:
    if: github.repository == 'Davidlequnchen/emotion_recognition'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: emotion_recognition_benchmark/dependencies/torch-${{ inputs.cuda }}-cp311-linux_x86_64
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: emotion_recognition_benchmark/dependencies/torch-${{ inputs.cuda }}-cp311-linux_x86_64
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          architecture: x64
      - name: Download and verify pinned upstream wheels
        run: python download.py --source upstream
      - name: Audit dependency closure and install order
        run: python audit.py
      - name: Install every wheel with networking disabled
        run: |
          python -m venv "$RUNNER_TEMP/torch-wheels-venv"
          sudo unshare --net -- env PIP_NO_CACHE_DIR=1 PIP_DISABLE_PIP_VERSION_CHECK=1 \
            LD_LIBRARY_PATH="${LD_LIBRARY_PATH:-}" \
            "$RUNNER_TEMP/torch-wheels-venv/bin/python" "$PWD/install.py"
      - name: Check native imports and CPU operations
        env:
          TORCH_CUDA_BUILD: ${{ inputs.cuda }}
        run: |
          "$RUNNER_TEMP/torch-wheels-venv/bin/python" - <<'PY'
          import os

          import torch
          import torchaudio
          import torchvision
          import triton

          build = os.environ['TORCH_CUDA_BUILD']
          cuda_version = {'cu118': '11.8', 'cu128': '12.8'}[build]
          assert torch.__version__ == f'2.7.1+{build}', torch.__version__
          assert torchaudio.__version__ == f'2.7.1+{build}', torchaudio.__version__
          assert torchvision.__version__ == f'0.22.1+{build}', torchvision.__version__
          assert torch.version.cuda == cuda_version, torch.version.cuda
          assert torch.arange(4).sum().item() == 6
          result = torchvision.ops.nms(
              torch.tensor([[0., 0., 1., 1.], [0., 0., 1., 1.]]),
              torch.tensor([0.9, 0.8]), 0.5)
          assert result.tolist() == [0], result
          print('Verified:', torch.__version__, torchaudio.__version__, torchvision.__version__)
          print('CUDA build:', torch.version.cuda, '| GPU available on runner:', torch.cuda.is_available())
          print('Triton:', triton.__version__, '| CPU tensor and torchvision NMS checks passed.')
          PY
      - name: Mirror missing wheels and update Release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python publish.py
