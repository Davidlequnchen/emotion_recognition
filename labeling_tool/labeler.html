<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Works fully offline: no request ever leaves this page (audio, text and labels stay on this computer). -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src blob:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Emotion Labeler</title>
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --text: #1c2024; --muted: #60646c; --line: #e0e1e6;
  --accent: #3e63dd; --accent-soft: #edf2fe; --ok: #30a46c; --warn: #f5a524; --bad: #e5484d;
  --wave: #c1c8d6; --wave-played: #3e63dd; --shadow: 0 1px 3px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #111113; --card: #19191b; --text: #edeef0; --muted: #a0a1a8; --line: #2e2f33;
          --accent: #7b96f5; --accent-soft: #1d2340; --wave: #3b3d44; --wave-played: #7b96f5;
          --shadow: 0 1px 3px rgba(0,0,0,.4); }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
       font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC",
             "Microsoft YaHei", sans-serif; }
button { font: inherit; color: inherit; cursor: pointer; }
.hidden { display: none !important; }
.wrap { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
        padding: 22px; }
h1 { font-size: 24px; margin: 0 0 4px; }
h2 { font-size: 18px; margin: 0 0 12px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 9px 16px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
kbd { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; border: 1px solid var(--line); border-bottom-width: 2px;
      border-radius: 5px; padding: 0 5px; background: var(--bg); color: var(--muted); }
.notice { border-radius: 10px; padding: 10px 14px; margin-top: 14px; font-size: 14px; }
.notice.warn { background: color-mix(in srgb, var(--warn) 14%, transparent); }
.notice.err { background: color-mix(in srgb, var(--bad) 14%, transparent); }

/* start screens */
.start { max-width: 560px; margin: 8vh auto 0; }
.start .steps { margin: 18px 0 6px; padding-left: 20px; color: var(--muted); }
.field { display: block; margin: 14px 0; }
.field span { display: block; font-weight: 600; margin-bottom: 6px; }
.field input, .field select { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
                              background: var(--bg); color: var(--text); font: inherit; }
.tree { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--bg); border-radius: 10px;
        padding: 10px 14px; color: var(--muted); white-space: pre; overflow-x: auto; }

/* labeling screen */
header.top { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.who { background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 4px 12px; font-weight: 600;
       font-size: 13px; }
.progress { margin-bottom: 16px; }
.bar { height: 10px; background: var(--line); border-radius: 999px; overflow: hidden; }
.bar > div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--ok)); width: 0; transition: width .3s; }
.progress .row { margin-top: 6px; font-size: 13px; color: var(--muted); }
.clipname { font-weight: 600; font-size: 16px; word-break: break-all; }
.wave { width: 100%; height: 96px; display: block; margin: 14px 0 6px; cursor: pointer; border-radius: 8px;
        background: var(--bg); }
.player { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.play { width: 52px; height: 52px; border-radius: 50%; border: none; background: var(--accent); color: #fff;
        font-size: 20px; display: grid; place-items: center; }
.time { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); }
.transcript { margin-top: 14px; padding: 12px 14px; border-left: 3px solid var(--accent); background: var(--bg);
              border-radius: 0 10px 10px 0; font-size: 16px; }
.transcript.none { border-left-color: var(--line); color: var(--muted); font-style: italic; font-size: 14px; }
.labels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 18px; }
@media (max-width: 640px) { .labels { grid-template-columns: repeat(2, 1fr); } }
.label { position: relative; border: 2px solid var(--line); background: var(--card); border-radius: 12px;
         padding: 14px 8px 10px; text-align: center; transition: transform .08s, border-color .15s, background .15s; }
.label:hover { border-color: var(--c); transform: translateY(-1px); }
.label .emo { font-size: 28px; line-height: 1.1; display: block; }
.label .name { font-weight: 600; display: block; margin-top: 4px; }
.label .zh { font-size: 13px; color: var(--muted); display: block; }
.label kbd { position: absolute; top: 6px; left: 8px; }
.label.selected { border-color: var(--c); background: color-mix(in srgb, var(--c) 14%, var(--card)); }
.preds { margin-top: 14px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
.preds .head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.preds .head b { color: var(--text); font-size: 14px; }
.preds ul { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
.preds li { display: flex; gap: 10px; align-items: center; font-size: 14px; }
.preds li .m { min-width: 170px; color: var(--muted); }
.preds li .sc { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); }
.preds .reveal { border: 1px dashed var(--line); background: transparent; border-radius: 8px; padding: 5px 12px;
                 font-size: 13px; color: var(--muted); margin-top: 6px; }
.label .bot { position: absolute; top: 6px; right: 8px; font-size: 11px; border-radius: 999px; padding: 0 6px;
              background: color-mix(in srgb, var(--c) 18%, transparent); color: var(--text); }
.chip.raw { background: transparent; color: var(--text); border: 1px solid var(--line); }
.badrow { display: flex; justify-content: flex-end; margin-top: 12px; }
.badbtn { border: 1px dashed var(--line); background: transparent; border-radius: 10px; padding: 7px 14px;
          color: var(--muted); font-size: 14px; }
.badbtn:hover, .badbtn.selected { border-color: var(--bad); color: var(--bad); }
.badbtn.selected { border-style: solid; background: color-mix(in srgb, var(--bad) 10%, transparent); }
.nav { display: flex; gap: 10px; margin-top: 18px; align-items: center; flex-wrap: wrap; }
.status { font-size: 13px; color: var(--muted); }
.status.ok { color: var(--ok); }
.keys { margin-top: 14px; font-size: 12px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }

/* clip list drawer */
.drawer { position: fixed; top: 0; right: 0; width: min(380px, 92vw); height: 100vh; background: var(--card);
          border-left: 1px solid var(--line); box-shadow: -8px 0 24px rgba(0,0,0,.12); transform: translateX(105%);
          transition: transform .2s; display: flex; flex-direction: column; z-index: 10; }
.drawer.open { transform: none; }
.drawer header { padding: 16px; border-bottom: 1px solid var(--line); }
.drawer .filters { display: flex; gap: 6px; margin-top: 10px; }
.drawer .filters button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 3px 10px;
                          font-size: 13px; }
.drawer .filters button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.drawer ul { list-style: none; margin: 0; padding: 6px; overflow-y: auto; flex: 1; }
.drawer li { display: flex; gap: 8px; align-items: center; padding: 7px 10px; border-radius: 8px; cursor: pointer;
             font-size: 13px; }
.drawer li:hover { background: var(--bg); }
.drawer li.current { background: var(--accent-soft); }
.drawer li .n { color: var(--muted); width: 38px; text-align: right; font-variant-numeric: tabular-nums; }
.drawer li .f { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip { border-radius: 999px; padding: 1px 8px; font-size: 12px; color: #fff; background: var(--c, var(--muted)); }
.chip.todo { background: transparent; color: var(--muted); border: 1px dashed var(--line); }

.done { text-align: center; padding: 40px 22px; }
.done .big { font-size: 56px; }
</style>
</head>
<body>

<!-- 1. Choose the data folder -->
<section id="scrFolder" class="wrap">
  <div class="start card">
    <h1 data-t="title"></h1>
    <p class="muted" data-t="intro"></p>
    <ol class="steps"><li data-t="step1"></li><li data-t="step2"></li><li data-t="step3"></li></ol>
    <div class="row" style="margin-top:18px">
      <button id="btnPick" class="btn primary" data-t="pickFolder"></button>
      <button id="btnReopen" class="btn hidden"></button>
      <label id="lblFallback" class="btn hidden"><span data-t="pickFolderRO"></span>
        <input id="inpFolder" type="file" webkitdirectory multiple class="hidden"></label>
    </div>
    <div id="fallbackNote" class="notice warn hidden" data-t="fallbackNote"></div>
    <div id="folderErr" class="notice err hidden"></div>
    <p class="small muted" style="margin-top:18px" data-t="expected"></p>
    <div class="tree">emotion_labeling/
├── config/labels.json     (optional)
├── audio/
│   ├── clip_0001.wav
│   ├── clip_0001.txt      (optional transcript)
│   └── clip_0002.mp3
└── annotations/           (written by this tool)</div>
    <p class="small muted" style="margin-top:14px" data-t="privacy"></p>
  </div>
</section>

<!-- 2. Who is labeling -->
<section id="scrLogin" class="wrap hidden">
  <div class="start card">
    <h1 data-t="whoTitle"></h1>
    <p class="muted" id="folderInfo"></p>
    <label class="field"><span data-t="yourName"></span><input id="inpName" maxlength="40" autocomplete="nickname"></label>
    <label class="field"><span data-t="listenerId"></span><select id="selListener"></select></label>
    <div class="row"><button id="btnStart" class="btn primary" data-t="start"></button>
      <button id="btnBackFolder" class="btn" data-t="otherFolder"></button></div>
    <div id="loginWarn" class="notice warn hidden"></div>
    <div id="loginErr" class="notice err hidden"></div>
  </div>
</section>

<!-- 3. Labeling -->
<section id="scrLabel" class="wrap hidden">
  <header class="top">
    <h1 style="font-size:20px" data-t="title"></h1>
    <span class="who" id="who"></span>
    <span class="spacer"></span>
    <button class="btn" id="btnList" data-t="clipList"></button>
    <button class="btn" id="btnExport" data-t="export"></button>
    <button class="btn" id="btnSwitch" data-t="switchUser"></button>
  </header>
  <div class="progress">
    <div class="bar"><div id="barFill"></div></div>
    <div class="row"><span id="progText"></span><span class="spacer"></span><span id="etaText"></span></div>
  </div>
  <div id="saveWarn" class="notice warn hidden" data-t="saveWarn"></div>

  <div id="labelCard" class="card">
    <div class="row">
      <span class="muted small" id="posText"></span>
      <span class="clipname" id="clipName"></span>
      <span class="spacer"></span>
      <span id="doneChip"></span>
    </div>
    <canvas id="wave" class="wave"></canvas>
    <div class="player">
      <button class="play" id="btnPlay" title="Space">▶</button>
      <button class="btn" id="btnReplay"><span data-t="replay"></span> <kbd>R</kbd></button>
      <span class="time" id="timeText">0:00 / 0:00</span>
    </div>
    <div class="transcript" id="transcript"></div>
    <div class="preds hidden" id="preds"></div>
    <div class="labels" id="labels"></div>
    <div class="badrow"><button class="badbtn" id="btnBad"></button></div>
    <div class="nav">
      <button class="btn" id="btnPrev">◀ <span data-t="prev"></span></button>
      <button class="btn" id="btnNext"><span data-t="next"></span> ▶</button>
      <button class="btn" id="btnNextTodo"><span data-t="nextTodo"></span> <kbd>U</kbd></button>
      <span class="spacer"></span>
      <span class="status" id="saveStatus"></span>
    </div>
    <div class="keys" id="keysHelp"></div>
  </div>

  <div id="doneCard" class="card done hidden">
    <div class="big">🎉</div>
    <h2 data-t="allDone"></h2>
    <p class="muted" id="doneText"></p>
    <div class="row" style="justify-content:center">
      <button class="btn primary" id="btnExport2" data-t="export"></button>
      <button class="btn" id="btnReview" data-t="review"></button>
    </div>
  </div>
</section>

<aside class="drawer" id="drawer">
  <header>
    <div class="row"><h2 style="margin:0" data-t="clipList"></h2><span class="spacer"></span>
      <button class="btn" id="btnCloseList">✕</button></div>
    <div class="filters" id="filters">
      <button data-f="all" class="on" data-t="fAll"></button>
      <button data-f="todo" data-t="fTodo"></button>
      <button data-f="done" data-t="fDone"></button>
      <button data-f="bad" data-t="fBad"></button>
    </div>
  </header>
  <ul id="clipList"></ul>
</aside>

<script>
"use strict";
// =====================================================================
// Emotion Labeler: a single-file, offline tool for labeling the emotion of audio clips.
// Reads <folder>/audio/*.{wav,mp3,...} (+ optional same-name .txt transcripts) and <folder>/config/labels.json,
// writes <folder>/annotations/annotations_<listener>_<name>.csv after every label (Chrome / Edge).
// Other browsers: read-only folder access; labels are kept in this browser and saved with "Export CSV".
// =====================================================================

const DEFAULT_CONFIG = {
  version: "emotion8-v1",
  language: "en",                // en | zh | both
  listeners: ["listener1", "listener2", "listener3", "listener4"],
  randomize: true,               // shuffle the clips per listener (the same order every time for that listener)
  autoplay: true,                // play each clip when it opens
  auto_advance: true,            // go to the next clip after choosing a label
  audio_folder: "audio",
  annotations_folder: "annotations",
  predictions_folder: "predictions",  // optional CSV files of model predictions: <folder>/predictions/<model>.csv
  models: [],                    // [{id, name, file}] to choose and name them; empty = every CSV in predictions_folder
  predictions_mode: "show",      // show | click (hidden until "Show model predictions") | off
  labels: [
    {id: "angry", en: "Angry", zh: "生气", emoji: "😠", color: "#e5484d", key: "1"},
    {id: "disgusted", en: "Disgusted", zh: "厌恶", emoji: "🤢", color: "#46a758", key: "2"},
    {id: "fearful", en: "Fearful", zh: "恐惧", emoji: "😨", color: "#8e4ec6", key: "3"},
    {id: "happy", en: "Happy", zh: "开心", emoji: "😄", color: "#f5a524", key: "4"},
    {id: "neutral", en: "Neutral", zh: "中性", emoji: "😐", color: "#8b8d98", key: "5"},
    {id: "sad", en: "Sad", zh: "难过", emoji: "😢", color: "#3e63dd", key: "6"},
    {id: "surprised", en: "Surprised", zh: "吃惊", emoji: "😲", color: "#12a594", key: "7"},
    {id: "unknown", en: "Unknown / Other", zh: "未知 / 其他", emoji: "❓", color: "#6f6e77", key: "8"},
  ],
  bad_clip: {id: "bad_clip", en: "Bad clip — skip", zh: "坏数据（不标注）", emoji: "🚫", key: "0"},
};
const AUDIO_EXT = ["wav", "mp3", "flac", "ogg", "m4a", "aac", "webm"];
const CSV_COLUMNS = ["file", "transcript", "label", "listener_id", "listener_name", "labeled_at", "play_count",
                     "seconds_spent", "labels_version"];

const STR = {
  en: {
    title: "Emotion Labeler",
    intro: "Listen to each clip and choose the emotion you hear. Your labels are saved automatically.",
    step1: "Choose the data folder (it holds an audio/ folder).", step2: "Enter your name and listener number.",
    step3: "Listen, then click an emotion or press its number key.",
    pickFolder: "Choose data folder", pickFolderRO: "Choose data folder (read-only)", reopen: "Reopen “{0}”",
    fallbackNote: "This browser cannot save into the folder. Your labels are kept in this browser; use “Export CSV” to save them. Chrome or Edge saves them into the folder automatically.",
    expected: "Expected folder layout:",
    privacy: "Everything stays on this computer: the page works offline and sends nothing anywhere.",
    whoTitle: "Who is labeling?", yourName: "Your name or nickname", listenerId: "Listener number",
    start: "Start labeling", otherFolder: "Choose another folder",
    needName: "Please enter your name.", folderFound: "Folder “{0}”: {1} clips, {2} with text.",
    noAudio: "No audio files found. Put the clips in an “audio” folder inside the data folder ({0}).",
    badConfig: "config/labels.json could not be read ({0}); the default labels are used.",
    clipList: "Clip list", export: "Export CSV", switchUser: "Switch user", replay: "Replay",
    prev: "Previous", next: "Next", nextTodo: "Next unlabeled",
    progress: "{0} of {1} done ({2}%)", eta: "about {0} left", noText: "No transcript for this clip.",
    clipOf: "Clip {0} / {1}", saved: "Saved to {0}", savedLocal: "Saved in this browser",
    saveFailed: "Could not save to the folder: {0}. Labels are kept in this browser; please use Export CSV.",
    saveWarn: "Labels are kept in this browser only. Click “Export CSV” before you close it, and send the file on.",
    allDone: "All clips are labeled — thank you!", doneText: "{0} clips: {1} labeled, {2} marked as bad.",
    review: "Review labels", fAll: "All", fTodo: "To do", fDone: "Done", fBad: "Bad",
    keys: "Keys:", kPlay: "play / pause", kLabels: "choose", kBad: "bad clip", kNav: "previous / next",
    resumed: "Welcome back — {0} labels loaded.", min: "{0} min", lessMin: "less than a minute",
    loading: "Loading…", decodeFail: "This clip could not be decoded; mark it as a bad clip if it does not play.",
    preds: "Model predictions", predsHint: "Suggestions from models that ran before you. They can be wrong: choose what you hear.",
    showPreds: "Show model predictions", noPred: "no prediction for this clip", predsFound: " Predictions of {0} model(s): {1}.",
    badPreds: "{0} could not be read ({1}).", predBadge: "predicted by {0}",
    pickedAudio: "Note: this looks like the audio folder itself. Choose the folder above it (the data folder) so that config/, predictions/ and annotations/ are found next to audio/.",
  },
  zh: {
    title: "情绪标注工具",
    intro: "逐条听音频，选择你听到的情绪。标注结果会自动保存。",
    step1: "选择数据文件夹（里面有 audio/ 文件夹）。", step2: "输入你的名字和标注员编号。",
    step3: "听完后点击一个情绪，或按对应的数字键。",
    pickFolder: "选择数据文件夹", pickFolderRO: "选择数据文件夹（只读）", reopen: "重新打开“{0}”",
    fallbackNote: "这个浏览器不能写入文件夹。标注结果保存在浏览器里，请用“导出 CSV”保存。用 Chrome 或 Edge 会自动保存到文件夹。",
    expected: "数据文件夹的结构：",
    privacy: "所有内容都只在这台电脑上：页面离线运行，不会向任何地方发送数据。",
    whoTitle: "谁在标注？", yourName: "你的名字或昵称", listenerId: "标注员编号",
    start: "开始标注", otherFolder: "换一个文件夹",
    needName: "请输入你的名字。", folderFound: "文件夹“{0}”：{1} 条音频，其中 {2} 条有文字。",
    noAudio: "没有找到音频文件。请把音频放在数据文件夹里的 audio 文件夹中（{0}）。",
    badConfig: "无法读取 config/labels.json（{0}），已使用默认标签。",
    clipList: "音频列表", export: "导出 CSV", switchUser: "切换用户", replay: "重播",
    prev: "上一条", next: "下一条", nextTodo: "下一条未标注",
    progress: "已完成 {0} / {1}（{2}%）", eta: "预计还需 {0}", noText: "这条音频没有文字。",
    clipOf: "第 {0} / {1} 条", saved: "已保存到 {0}", savedLocal: "已保存在浏览器中",
    saveFailed: "无法保存到文件夹：{0}。结果已保存在浏览器里，请使用“导出 CSV”。",
    saveWarn: "标注结果只保存在这个浏览器里。关闭前请点击“导出 CSV”，并把文件发出去。",
    allDone: "全部标注完成，谢谢！", doneText: "共 {0} 条：已标注 {1} 条，坏数据 {2} 条。",
    review: "查看标注", fAll: "全部", fTodo: "未完成", fDone: "已完成", fBad: "坏数据",
    keys: "快捷键：", kPlay: "播放 / 暂停", kLabels: "选择", kBad: "坏数据", kNav: "上一条 / 下一条",
    resumed: "欢迎回来，已载入 {0} 条标注。", min: "{0} 分钟", lessMin: "不到 1 分钟",
    loading: "加载中…", decodeFail: "这条音频无法解码；如果播放不了，请标为坏数据。",
    preds: "模型预测", predsHint: "这些是模型事先给出的参考结果，可能有错：请按你听到的选择。",
    showPreds: "显示模型预测", noPred: "这条音频没有预测结果", predsFound: " 有 {0} 个模型的预测：{1}。",
    badPreds: "无法读取 {0}（{1}）。", predBadge: "预测者：{0}",
    pickedAudio: "注意：你选的似乎是 audio 文件夹本身。请选择它的上一级文件夹（数据文件夹），这样才能找到和 audio/ 并列的 config/、predictions/ 和 annotations/。",
  },
};

// ---------------------------------------------------------------------
// Small helpers
// ---------------------------------------------------------------------
const $ = (id) => document.getElementById(id);
let config = structuredClone(DEFAULT_CONFIG);
const fmt = (s, ...a) => s.replace(/\{(\d)\}/g, (_, i) => a[i]);
function t(key, ...a) {  // a UI string in the configured language ("both" = English / Chinese)
  const en = fmt(STR.en[key] ?? key, ...a), zh = fmt(STR.zh[key] ?? key, ...a);
  return config.language === "zh" ? zh : config.language === "both" ? `${en} / ${zh}` : en;
}
function labelText(l) {
  return config.language === "zh" ? (l.zh || l.en) : l.en || l.id;
}
function applyStrings() {
  document.documentElement.lang = config.language === "zh" ? "zh" : "en";
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t(el.dataset.t); });
  document.title = t("title");
}
const mmss = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const stem = (name) => name.replace(/\.[^.]+$/, "");
const ext = (name) => (name.match(/\.([^.]+)$/) || [, ""])[1].toLowerCase();
const safeName = (s) => s.trim().replace(/[^\p{L}\p{N}_-]+/gu, "_").slice(0, 40) || "anonymous";

function hashString(s) {  // FNV-1a, 32 bit
  let h = 0x811c9dc5;
  for (const ch of s) { h ^= ch.codePointAt(0); h = Math.imul(h, 0x01000193) >>> 0; }
  return h;
}
function seededShuffle(items, seed) {  // Fisher-Yates with mulberry32: the same seed gives the same order
  let a = seed >>> 0;
  const rand = () => { a = (a + 0x6d2b79f5) >>> 0; let x = a; x = Math.imul(x ^ (x >>> 15), x | 1);
                       x ^= x + Math.imul(x ^ (x >>> 7), x | 61); return ((x ^ (x >>> 14)) >>> 0) / 4294967296; };
  const out = items.slice();
  for (let i = out.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [out[i], out[j]] = [out[j], out[i]]; }
  return out;
}
function csvEscape(v) {
  const s = v == null ? "" : String(v);
  return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}
function parseCsv(text) {  // RFC 4180: quoted fields may hold commas, quotes ("") and line breaks
  text = text.replace(/^﻿/, "");
  const rows = []; let row = [], field = "", quoted = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else quoted = false; } else field += c;
    } else if (c === '"') quoted = true;
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(field); rows.push(row); row = []; field = "";
    } else field += c;
  }
  if (field !== "" || row.length) { row.push(field); rows.push(row); }
  const [head, ...body] = rows.filter((r) => r.length > 1 || r[0] !== "");
  return head ? body.map((r) => Object.fromEntries(head.map((h, i) => [h, r[i] ?? ""]))) : [];
}

// State
// ---------------------------------------------------------------------
const S = {
  mode: null,            // "fs" (read and write the folder) | "ro" (read-only files from <input webkitdirectory>)
  root: null,            // FileSystemDirectoryHandle in "fs" mode
  folderName: "",
  clips: [],             // {name, getFile(), getText()} sorted by name
  order: [],             // clip indices in labeling order
  pos: 0,                // position in `order`
  listenerId: "", listenerName: "",
  ann: new Map(),        // clip name -> {label, labeled_at, play_count, seconds_spent}
  shownAt: 0, plays: 0,  // timing and play count of the clip on screen
  saveQueue: Promise.resolve(), saveOk: true,
  sessionTimes: [],      // seconds spent per clip labeled in this session (for the time estimate)
  filter: "all",
  models: [],            // {id, name, byFile: Map(file or stem -> {label, score})}
  revealed: new Set(),   // clips whose predictions were revealed (predictions_mode "click")
  predNote: "",
};
const audio = new Audio();
let objectUrl = null, peaks = null, rafId = 0;

// ---------------------------------------------------------------------
// Folder access
// ---------------------------------------------------------------------
async function readConfigText(text) {
  const user = JSON.parse(text);
  config = {...structuredClone(DEFAULT_CONFIG), ...user};
  if (!Array.isArray(config.labels) || !config.labels.length) throw new Error("labels must be a non-empty list");
  const ids = new Set();
  config.labels.forEach((l, i) => {
    if (!l.id) throw new Error(`label ${i + 1} has no id`);
    if (ids.has(l.id)) throw new Error(`duplicate label id "${l.id}"`);
    ids.add(l.id);
    l.key = String(l.key ?? (i < 9 ? i + 1 : "")).toLowerCase();
    l.color = l.color || "#6f6e77";
  });
  if (config.bad_clip) config.bad_clip.key = String(config.bad_clip.key ?? "0").toLowerCase();
}

async function loadFromHandle(root) {  // Chrome / Edge: File System Access API
  S.mode = "fs"; S.root = root; S.folderName = root.name;
  let configNote = "";
  config = structuredClone(DEFAULT_CONFIG);
  try {
    const cfgDir = await root.getDirectoryHandle("config");
    const f = await (await cfgDir.getFileHandle("labels.json")).getFile();
    await readConfigText(await f.text());
  } catch (e) {
    config = structuredClone(DEFAULT_CONFIG);
    if (e.name !== "NotFoundError") configNote = t("badConfig", e.message);
  }
  let dir = root;
  S.noAudioFolder = false;
  try { dir = await root.getDirectoryHandle(config.audio_folder); } catch { S.noAudioFolder = true; /* audio files directly in the folder */ }
  const files = new Map();
  for await (const [name, h] of dir.entries()) if (h.kind === "file") files.set(name, h);
  const csvs = {};
  try {
    const pd = await root.getDirectoryHandle(config.predictions_folder);
    for await (const [name, h] of pd.entries()) if (h.kind === "file" && ext(name) === "csv") csvs[name] = () => h.getFile().then((f) => f.text());
  } catch { /* no predictions */ }
  await loadPredictions(csvs);
  S.clips = [...files.keys()].filter((n) => AUDIO_EXT.includes(ext(n)) && !n.startsWith(".")).sort(byName).map((n) => {
    const txt = files.get(stem(n) + ".txt");
    return {name: n, getFile: () => files.get(n).getFile(),
            getText: txt ? async () => (await (await txt.getFile()).text()).trim() : null};
  });
  return configNote;
}

async function loadFromFileList(list) {  // other browsers: <input webkitdirectory> (read-only)
  S.mode = "ro"; S.root = null;
  const all = [...list];
  S.folderName = all.length ? all[0].webkitRelativePath.split("/")[0] : "";
  let configNote = "";
  config = structuredClone(DEFAULT_CONFIG);
  const cfg = all.find((f) => /^[^/]+\/config\/labels\.json$/.test(f.webkitRelativePath));
  if (cfg) { try { await readConfigText(await cfg.text()); } catch (e) { config = structuredClone(DEFAULT_CONFIG);
                                                                          configNote = t("badConfig", e.message); } }
  const csvs = {};
  for (const f of all) { const parts = f.webkitRelativePath.split("/");
                         if (parts.length === 3 && parts[1] === config.predictions_folder && ext(f.name) === "csv") csvs[f.name] = () => f.text(); }
  await loadPredictions(csvs);
  const inAudio = all.filter((f) => f.webkitRelativePath.split("/")[1] === config.audio_folder &&
                                    f.webkitRelativePath.split("/").length === 3);
  S.noAudioFolder = !inAudio.length;
  const pool = inAudio.length ? inAudio : all.filter((f) => f.webkitRelativePath.split("/").length === 2);
  const byStem = new Map(pool.map((f) => [f.name, f]));
  S.clips = pool.filter((f) => AUDIO_EXT.includes(ext(f.name)) && !f.name.startsWith(".")).sort((a, b) => byName(a.name, b.name))
    .map((f) => { const txt = byStem.get(stem(f.name) + ".txt");
                  return {name: f.name, getFile: async () => f, getText: txt ? async () => (await txt.text()).trim() : null}; });
  return configNote;
}
// Model predictions: one CSV per model with the columns file, label and (optional) score (0-1)
async function loadPredictions(csvs) {
  S.models = []; S.predNote = "";
  const wanted = config.models && config.models.length ? config.models
    : Object.keys(csvs).sort(byName).map((n) => ({id: stem(n), name: stem(n), file: n}));
  for (const m of wanted) {
    const fileName = (m.file || `${m.id}.csv`).split("/").pop();
    if (!csvs[fileName]) continue;
    try {
      const byFile = new Map();
      for (const r of parseCsv(await csvs[fileName]())) {
        if (!r.file) continue;
        const v = {label: (r.label ?? "").trim(), score: r.score === undefined || r.score === "" ? null : +r.score};
        byFile.set(r.file, v); byFile.set(stem(r.file), v);
      }
      S.models.push({id: m.id || stem(fileName), name: m.name || m.id || stem(fileName), byFile});
    } catch (e) { S.predNote += " " + t("badPreds", fileName, e.message); }
  }
}
function predictionFor(model, clip) { return model.byFile.get(clip.name) || model.byFile.get(stem(clip.name)) || null; }
function matchLabel(raw) {  // a model's label -> a label of the config (by id, English or Chinese name; "生气/angry" works)
  const v = String(raw).trim().toLowerCase(), last = v.split("/").pop().trim();
  return config.labels.find((l) => [l.id, l.en, l.zh].filter(Boolean).some((x) => [v, last].includes(String(x).toLowerCase())))
         || (config.bad_clip && [v, last].includes(config.bad_clip.id) ? config.bad_clip : null);
}
const collator = new Intl.Collator(undefined, {numeric: true, sensitivity: "base"});
const byName = (a, b) => collator.compare(a, b);

// Remember the last folder (Chrome / Edge keep the handle in IndexedDB; permission is asked again)
function idb() {
  return new Promise((ok, err) => { const r = indexedDB.open("emotion-labeler", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => ok(r.result); r.onerror = () => err(r.error); });
}
async function idbSet(k, v) { try { const db = await idb(); db.transaction("kv", "readwrite").objectStore("kv").put(v, k); } catch {} }
async function idbGet(k) {
  try { const db = await idb(); return await new Promise((ok) => { const r = db.transaction("kv").objectStore("kv").get(k);
                                                                    r.onsuccess = () => ok(r.result); r.onerror = () => ok(null); }); }
  catch { return null; }
}

// ---------------------------------------------------------------------
// Annotations: one CSV per listener in <folder>/annotations/, plus a copy in this browser
// ---------------------------------------------------------------------
const annFileName = () => `annotations_${safeName(S.listenerId)}_${safeName(S.listenerName)}.csv`;
const localKey = () => `emotion-labeler:${S.folderName}:${S.listenerId}:${safeName(S.listenerName)}`;

function annotationsCsv() {
  const lines = [CSV_COLUMNS.join(",")];
  for (const c of S.clips) {
    const a = S.ann.get(c.name);
    if (!a) continue;
    lines.push([c.name, a.transcript ?? "", a.label, S.listenerId, S.listenerName, a.labeled_at, a.play_count,
                a.seconds_spent, config.version].map(csvEscape).join(","));
  }
  return "﻿" + lines.join("\r\n") + "\r\n";  // BOM: Excel then reads the UTF-8 (e.g. Chinese) correctly
}
function mergeRows(rows) {  // keep the newer label of each clip
  let n = 0;
  for (const r of rows) {
    if (!r.file || !r.label) continue;
    const old = S.ann.get(r.file);
    if (!old || (r.labeled_at || "") > (old.labeled_at || "")) {
      S.ann.set(r.file, {label: r.label, labeled_at: r.labeled_at, play_count: +r.play_count || 0,
                         seconds_spent: +r.seconds_spent || 0, transcript: r.transcript}); n++;
    }
  }
  return n;
}
async function loadAnnotations() {
  S.ann = new Map();
  try { mergeRows(JSON.parse(localStorage.getItem(localKey()) || "[]")); } catch {}
  if (S.mode === "fs") {
    try {
      const dir = await S.root.getDirectoryHandle(config.annotations_folder);
      const f = await (await dir.getFileHandle(annFileName())).getFile();
      mergeRows(parseCsv(await f.text()));
    } catch { /* first session: no file yet */ }
  }
  return S.ann.size;
}
function saveAll() {
  const rows = S.clips.filter((c) => S.ann.has(c.name)).map((c) => ({file: c.name, ...S.ann.get(c.name)}));
  try { localStorage.setItem(localKey(), JSON.stringify(rows)); } catch {}
  if (S.mode !== "fs") { setStatus(t("savedLocal"), true); return; }
  const csv = annotationsCsv();
  S.saveQueue = S.saveQueue.then(async () => {  // one write at a time, in order
    try {
      const dir = await S.root.getDirectoryHandle(config.annotations_folder, {create: true});
      const w = await (await dir.getFileHandle(annFileName(), {create: true})).createWritable();
      await w.write(csv); await w.close();
      S.saveOk = true; $("saveWarn").classList.add("hidden");
      setStatus(t("saved", `${config.annotations_folder}/${annFileName()}`), true);
    } catch (e) {
      S.saveOk = false; setStatus(t("saveFailed", e.message), false);
      $("saveWarn").classList.remove("hidden");
    }
  });
}
function exportCsv() {
  const url = URL.createObjectURL(new Blob([annotationsCsv()], {type: "text/csv;charset=utf-8"}));
  const a = Object.assign(document.createElement("a"), {href: url, download: annFileName()});
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function setStatus(msg, ok) { const el = $("saveStatus"); el.textContent = msg; el.className = "status" + (ok ? " ok" : ""); }

// ---------------------------------------------------------------------
// Screens
// ---------------------------------------------------------------------
function show(id) { ["scrFolder", "scrLogin", "scrLabel"].forEach((s) => $(s).classList.toggle("hidden", s !== id)); }

async function afterFolder(configNote) {
  applyStrings();
  if (!S.clips.length) {
    const e = $("folderErr"); e.textContent = t("noAudio", AUDIO_EXT.join(", ")); e.classList.remove("hidden");
    show("scrFolder"); return;
  }
  const withText = S.clips.filter((c) => c.getText).length;
  const preds = S.models.length ? t("predsFound", S.models.length, S.models.map((m) => m.name).join(", ")) : "";
  $("folderInfo").textContent = t("folderFound", S.folderName, S.clips.length, withText) + preds + (configNote ? " " + configNote : "") + S.predNote;
  const warn = $("loginWarn");
  warn.textContent = t("pickedAudio");
  warn.classList.toggle("hidden", !(S.noAudioFolder && S.folderName.toLowerCase() === String(config.audio_folder).toLowerCase()));
  const sel = $("selListener"); sel.innerHTML = "";
  config.listeners.forEach((l) => sel.append(new Option(l, l)));
  $("inpName").value = localStorage.getItem("emotion-labeler:name") || "";
  const lastId = localStorage.getItem("emotion-labeler:listener");
  if (config.listeners.includes(lastId)) sel.value = lastId;
  $("loginErr").classList.add("hidden");
  show("scrLogin"); $("inpName").focus();
}

async function startLabeling() {
  const name = $("inpName").value.trim();
  if (!name) { const e = $("loginErr"); e.textContent = t("needName"); e.classList.remove("hidden"); return; }
  S.listenerName = name; S.listenerId = $("selListener").value; S.sessionTimes = []; S.filter = "all"; S.revealed = new Set();
  localStorage.setItem("emotion-labeler:name", name); localStorage.setItem("emotion-labeler:listener", S.listenerId);
  const idx = S.clips.map((_, i) => i);
  // The order depends only on the listener number, so it stays the same across sessions and computers
  S.order = config.randomize ? seededShuffle(idx, hashString(`${S.listenerId}|${config.version}`)) : idx;
  const n = await loadAnnotations();
  $("who").textContent = `${S.listenerId} · ${S.listenerName}`;
  $("saveWarn").classList.toggle("hidden", S.mode === "fs");
  buildLabelButtons(); buildKeysHelp(); show("scrLabel");
  setStatus(n ? t("resumed", n) : "", true);
  const first = S.order.findIndex((i) => !S.ann.has(S.clips[i].name));
  if (first < 0) showDone(); else openClip(first);
}

// ---------------------------------------------------------------------
// The labeling card
// ---------------------------------------------------------------------
function buildLabelButtons() {
  const box = $("labels"); box.innerHTML = "";
  for (const l of config.labels) {
    const b = document.createElement("button");
    b.className = "label"; b.dataset.id = l.id; b.style.setProperty("--c", l.color);
    b.innerHTML = `${l.key ? `<kbd>${l.key.toUpperCase()}</kbd>` : ""}<span class="bot hidden"></span><span class="emo"></span><span class="name"></span>` +
                  (config.language === "both" && l.zh ? `<span class="zh"></span>` : "");
    b.querySelector(".emo").textContent = l.emoji || "";
    b.querySelector(".name").textContent = labelText(l);
    if (b.querySelector(".zh")) b.querySelector(".zh").textContent = l.zh;
    b.onclick = () => choose(l.id);
    box.append(b);
  }
  const bad = config.bad_clip;
  $("btnBad").classList.toggle("hidden", !bad);
  if (bad) {
    const txt = config.language === "zh" ? bad.zh || bad.en : config.language === "both" ? `${bad.en} / ${bad.zh}` : bad.en;
    $("btnBad").innerHTML = ""; $("btnBad").append(`${bad.emoji || ""} ${txt} `);
    if (bad.key) { const k = document.createElement("kbd"); k.textContent = bad.key.toUpperCase(); $("btnBad").append(k); }
    $("btnBad").onclick = () => choose(bad.id);
  }
}
function buildKeysHelp() {
  const keys = config.labels.map((l) => l.key).filter(Boolean);
  const range = keys.length ? `${keys[0].toUpperCase()}–${keys[keys.length - 1].toUpperCase()}` : "";
  $("keysHelp").innerHTML = "";
  const add = (k, d) => { const s = document.createElement("span"); s.innerHTML = `<kbd></kbd> `; s.querySelector("kbd").textContent = k;
                          s.append(d); $("keysHelp").append(s); };
  $("keysHelp").append(t("keys"));
  add("Space", t("kPlay")); add("R", t("replay")); if (range) add(range, t("kLabels"));
  if (config.bad_clip?.key) add(config.bad_clip.key.toUpperCase(), t("kBad")); add("← →", t("kNav"));
}

function labelInfo(id) {
  if (config.bad_clip && id === config.bad_clip.id) return {...config.bad_clip, color: "#e5484d"};
  return config.labels.find((l) => l.id === id) || {id, en: id, color: "#6f6e77"};
}
function chipFor(id) {
  const s = document.createElement("span");
  if (!id) { s.className = "chip todo"; s.textContent = t("fTodo"); return s; }
  const l = labelInfo(id); s.className = "chip"; s.style.setProperty("--c", l.color);
  s.textContent = `${l.emoji || ""} ${labelText(l)}`.trim(); return s;
}

function leaveClip() {  // add the time spent on the clip on screen to its record (if it has one)
  const c = S.clips[S.order[S.pos]];
  if (!c || !S.shownAt) return;
  const a = S.ann.get(c.name);
  const spent = (performance.now() - S.shownAt) / 1000;
  if (a) { a.seconds_spent = Math.round(((+a.seconds_spent || 0) + spent) * 10) / 10; a.play_count = (+a.play_count || 0) + S.plays; }
  S.shownAt = 0; S.plays = 0;
}

async function openClip(pos) {
  if (S.shownAt) { leaveClip(); }
  S.pos = Math.max(0, Math.min(pos, S.order.length - 1));
  $("labelCard").classList.remove("hidden"); $("doneCard").classList.add("hidden");
  const c = S.clips[S.order[S.pos]];
  S.shownAt = performance.now(); S.plays = 0;
  $("posText").textContent = t("clipOf", S.pos + 1, S.order.length);
  $("clipName").textContent = c.name;
  updateSelection(); updateProgress(); renderList();
  // transcript
  const tr = $("transcript");
  if (c.getText) { tr.className = "transcript"; tr.textContent = t("loading"); c.text = await c.getText(); tr.textContent = c.text || t("noText");
                   if (!c.text) tr.className = "transcript none"; }
  else { c.text = ""; tr.className = "transcript none"; tr.textContent = t("noText"); }
  renderPreds(c);
  // audio and waveform
  audio.pause(); if (objectUrl) URL.revokeObjectURL(objectUrl);
  const file = await c.getFile();
  objectUrl = URL.createObjectURL(file); audio.src = objectUrl; peaks = null; drawWave();
  if (config.autoplay) audio.play().catch(() => {});
  try {
    const buf = await file.arrayBuffer();
    const ctx = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(1, 1, 44100);
    const decoded = await ctx.decodeAudioData(buf);
    if (S.clips[S.order[S.pos]] === c) { peaks = computePeaks(decoded, 400); drawWave(); }
  } catch { if (S.clips[S.order[S.pos]] === c) setStatus(t("decodeFail"), false); }
}

function renderPreds(c) {
  const box = $("preds"), mode = config.predictions_mode;
  document.querySelectorAll(".label .bot").forEach((b) => b.classList.add("hidden"));
  if (!S.models.length || mode === "off") { box.classList.add("hidden"); return; }
  box.classList.remove("hidden"); box.innerHTML = "";
  const head = document.createElement("div"); head.className = "head";
  head.innerHTML = "<b></b><span></span>"; head.querySelector("b").textContent = `🤖 ${t("preds")}`;
  head.querySelector("span").textContent = t("predsHint"); box.append(head);
  if (mode === "click" && !S.revealed.has(c.name)) {
    const b = document.createElement("button"); b.className = "reveal"; b.textContent = t("showPreds");
    b.onclick = () => { S.revealed.add(c.name); renderPreds(c); }; box.append(b); return;
  }
  const ul = document.createElement("ul"), votes = new Map();
  for (const m of S.models) {
    const p = predictionFor(m, c), li = document.createElement("li");
    li.innerHTML = `<span class="m"></span>`; li.querySelector(".m").textContent = m.name;
    if (!p || !p.label) { const s = document.createElement("span"); s.className = "muted small"; s.textContent = t("noPred"); li.append(s); }
    else {
      const l = matchLabel(p.label);
      if (l) { li.append(chipFor(l.id)); votes.set(l.id, [...(votes.get(l.id) || []), m.name]); }
      else { const s = document.createElement("span"); s.className = "chip raw"; s.textContent = p.label; li.append(s); }
      if (p.score !== null && !Number.isNaN(p.score)) { const s = document.createElement("span"); s.className = "sc";
                                                         s.textContent = `${Math.round(p.score * 100)}%`; li.append(s); }
    }
    ul.append(li);
  }
  box.append(ul);
  for (const [id, names] of votes) {  // a small badge on the emotion buttons the models chose
    const b = document.querySelector(`.label[data-id="${CSS.escape(id)}"] .bot`);
    if (b) { b.textContent = `🤖 ${names.length}`; b.title = t("predBadge", names.join(", ")); b.classList.remove("hidden"); }
  }
}

function choose(id) {
  const c = S.clips[S.order[S.pos]];
  const old = S.ann.get(c.name);
  const spent = (performance.now() - S.shownAt) / 1000;
  S.ann.set(c.name, {label: id, labeled_at: new Date().toISOString(), transcript: c.text || "",
                     play_count: (old ? +old.play_count : 0) + S.plays,
                     seconds_spent: Math.round(((old ? +old.seconds_spent : 0) + spent) * 10) / 10});
  if (!old) S.sessionTimes.push(spent);
  S.shownAt = performance.now(); S.plays = 0;
  saveAll(); updateSelection(); updateProgress(); renderList();
  if (config.auto_advance) {
    setTimeout(() => {
      const next = nextTodo(S.pos);
      if (next < 0) { audio.pause(); showDone(); } else openClip(next);
    }, 220);
  }
}
function nextTodo(from) {  // the next unlabeled clip after `from`, wrapping around; -1 when all are done
  for (let k = 1; k <= S.order.length; k++) {
    const p = (from + k) % S.order.length;
    if (!S.ann.has(S.clips[S.order[p]].name)) return p;
  }
  return -1;
}
function updateSelection() {
  const a = S.ann.get(S.clips[S.order[S.pos]].name);
  document.querySelectorAll(".label").forEach((b) => b.classList.toggle("selected", !!a && b.dataset.id === a.label));
  $("btnBad").classList.toggle("selected", !!a && config.bad_clip && a.label === config.bad_clip.id);
  const chip = $("doneChip"); chip.innerHTML = ""; chip.append(chipFor(a?.label));
  $("btnPrev").disabled = S.pos === 0; $("btnNext").disabled = S.pos === S.order.length - 1;
}
function updateProgress() {
  const total = S.clips.length, done = S.clips.filter((c) => S.ann.has(c.name)).length;
  $("barFill").style.width = `${total ? (100 * done) / total : 0}%`;
  $("progText").textContent = t("progress", done, total, total ? Math.floor((100 * done) / total) : 0);
  const times = S.sessionTimes.slice(-30);
  if (times.length >= 3 && done < total) {
    const left = (times.reduce((x, y) => x + y, 0) / times.length) * (total - done) / 60;
    $("etaText").textContent = t("eta", left < 1 ? t("lessMin") : t("min", Math.round(left)));
  } else $("etaText").textContent = "";
}
function showDone() {
  leaveClip();
  $("labelCard").classList.add("hidden"); $("doneCard").classList.remove("hidden");
  const bad = config.bad_clip ? [...S.ann.values()].filter((a) => a.label === config.bad_clip.id).length : 0;
  $("doneText").textContent = t("doneText", S.clips.length, S.ann.size - bad, bad);
  updateProgress(); renderList();
}

// ---------------------------------------------------------------------
// Waveform
// ---------------------------------------------------------------------
function computePeaks(buffer, n) {
  const ch = buffer.getChannelData(0), step = Math.max(1, Math.floor(ch.length / n)), out = [];
  for (let i = 0; i < n; i++) {
    let m = 0;
    for (let j = i * step, e = Math.min(ch.length, j + step); j < e; j++) { const v = Math.abs(ch[j]); if (v > m) m = v; }
    out.push(m);
  }
  const max = Math.max(...out, 1e-6);
  return out.map((v) => v / max);
}
function drawWave() {
  const cv = $("wave"), dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== w * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
  const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
  const css = getComputedStyle(document.documentElement);
  const played = audio.duration ? audio.currentTime / audio.duration : 0;
  const n = peaks ? peaks.length : 120, bw = w / n;
  for (let i = 0; i < n; i++) {
    const v = peaks ? Math.max(0.03, peaks[i]) : 0.06;
    g.fillStyle = i / n < played ? css.getPropertyValue("--wave-played") : css.getPropertyValue("--wave");
    const bh = v * (h - 12);
    g.fillRect(i * bw + bw * 0.15, (h - bh) / 2, Math.max(1, bw * 0.7), bh);
  }
  $("timeText").textContent = `${mmss(audio.currentTime || 0)} / ${mmss(audio.duration || 0)}`;
}
function tick() { drawWave(); if (!audio.paused) rafId = requestAnimationFrame(tick); }
audio.addEventListener("play", () => { if (audio.currentTime < 0.05 || audio.ended) S.plays++; $("btnPlay").textContent = "❚❚";
                                       cancelAnimationFrame(rafId); tick(); });
audio.addEventListener("pause", () => { $("btnPlay").textContent = "▶"; drawWave(); });
audio.addEventListener("ended", () => { $("btnPlay").textContent = "▶"; drawWave(); });
audio.addEventListener("loadedmetadata", drawWave);
$("wave").addEventListener("click", (e) => {
  if (!audio.duration) return;
  const r = e.currentTarget.getBoundingClientRect();
  audio.currentTime = ((e.clientX - r.left) / r.width) * audio.duration;
  if (audio.paused) audio.play().catch(() => {}); else drawWave();
});
window.addEventListener("resize", drawWave);
function togglePlay() { if (audio.paused) audio.play().catch(() => {}); else audio.pause(); }
function replay() { audio.currentTime = 0; S.plays++; audio.play().catch(() => {}); }

// ---------------------------------------------------------------------
// Clip list
// ---------------------------------------------------------------------
function renderList() {
  if (!$("drawer").classList.contains("open")) return;
  const ul = $("clipList"); ul.innerHTML = "";
  const badId = config.bad_clip?.id;
  S.order.forEach((ci, p) => {
    const c = S.clips[ci], a = S.ann.get(c.name);
    if (S.filter === "todo" && a) return;
    if (S.filter === "done" && (!a || a.label === badId)) return;
    if (S.filter === "bad" && (!a || a.label !== badId)) return;
    const li = document.createElement("li");
    if (p === S.pos && !$("labelCard").classList.contains("hidden")) li.className = "current";
    li.innerHTML = `<span class="n">${p + 1}</span><span class="f"></span>`;
    li.querySelector(".f").textContent = c.name; li.append(chipFor(a?.label));
    li.onclick = () => { openClip(p); };
    ul.append(li);
  });
}
$("btnList").onclick = () => { $("drawer").classList.add("open"); renderList();
                               $("clipList").querySelector(".current")?.scrollIntoView({block: "center"}); };
$("btnCloseList").onclick = () => $("drawer").classList.remove("open");
$("filters").onclick = (e) => {
  const f = e.target.dataset?.f; if (!f) return;
  S.filter = f; $("filters").querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.f === f)); renderList();
};

// ---------------------------------------------------------------------
// Buttons and keys
// ---------------------------------------------------------------------
$("btnPlay").onclick = togglePlay;
$("btnReplay").onclick = replay;
$("btnPrev").onclick = () => openClip(S.pos - 1);
$("btnNext").onclick = () => openClip(S.pos + 1);
$("btnNextTodo").onclick = () => { const n = nextTodo(S.pos); if (n < 0) showDone(); else openClip(n); };
$("btnExport").onclick = exportCsv; $("btnExport2").onclick = exportCsv;
$("btnReview").onclick = () => openClip(0);
$("btnSwitch").onclick = () => { leaveClip(); saveAll(); audio.pause(); afterFolder(""); };
$("btnBackFolder").onclick = () => show("scrFolder");
$("btnStart").onclick = startLabeling;
$("inpName").addEventListener("keydown", (e) => { if (e.key === "Enter") startLabeling(); });

document.addEventListener("keydown", (e) => {
  if ($("scrLabel").classList.contains("hidden") || e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  const k = e.key.toLowerCase();
  const onCard = !$("labelCard").classList.contains("hidden");
  if (k === " " && onCard) { e.preventDefault(); togglePlay(); }
  else if (k === "r" && onCard) replay();
  else if (k === "arrowleft" && onCard && S.pos > 0) openClip(S.pos - 1);
  else if (k === "arrowright" && onCard && S.pos < S.order.length - 1) openClip(S.pos + 1);
  else if (k === "u") $("btnNextTodo").click();
  else if (k === "escape") $("drawer").classList.remove("open");
  else if (onCard) {
    const l = config.labels.find((x) => x.key && x.key === k);
    if (l) choose(l.id); else if (config.bad_clip?.key === k) choose(config.bad_clip.id);
  }
});
window.addEventListener("beforeunload", () => { leaveClip(); saveAll(); });

// ---------------------------------------------------------------------
// Start
// ---------------------------------------------------------------------
async function useHandle(handle) {
  $("folderErr").classList.add("hidden");
  try {
    if ((await handle.queryPermission({mode: "readwrite"})) !== "granted" &&
        (await handle.requestPermission({mode: "readwrite"})) !== "granted") return;
    idbSet("lastFolder", handle);
    await afterFolder(await loadFromHandle(handle));
  } catch (e) { const el = $("folderErr"); el.textContent = e.message; el.classList.remove("hidden"); }
}
(async function init() {
  applyStrings();
  if ("showDirectoryPicker" in window) {
    $("btnPick").onclick = async () => {
      try { await useHandle(await window.showDirectoryPicker({id: "emotion-labeler", mode: "readwrite"})); }
      catch (e) { if (e.name !== "AbortError") { const el = $("folderErr"); el.textContent = e.message; el.classList.remove("hidden"); } }
    };
    const last = await idbGet("lastFolder");
    if (last) { const b = $("btnReopen"); b.textContent = t("reopen", last.name); b.classList.remove("hidden");
                b.onclick = () => useHandle(last); }
  } else {  // Firefox, Safari: read-only folder access
    $("btnPick").classList.add("hidden"); $("lblFallback").classList.remove("hidden"); $("fallbackNote").classList.remove("hidden");
    $("inpFolder").onchange = async (e) => { $("folderErr").classList.add("hidden"); await afterFolder(await loadFromFileList(e.target.files)); };
  }
})();
</script>
