<!doctype html>
<!-- Template for scripts/viewer/make_viewer.py, which fills the JSON block near the end with the results and the selected clips. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emotion Recognition Results</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --line: rgba(11, 11, 11, 0.09); --hover: rgba(11, 11, 11, 0.03); --chip: #f0efec; --track: #ecebe7;
    --accent: #2a78d6; --accent-bg: rgba(42, 120, 214, 0.10);
    --good: #006300; --good-bg: rgba(12, 163, 12, 0.12); --bad: #b52f2f; --bad-bg: rgba(208, 59, 59, 0.11);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
      --line: rgba(255, 255, 255, 0.09); --hover: rgba(255, 255, 255, 0.03); --chip: #2c2c2a; --track: #2c2c2a;
      --accent: #3987e5; --accent-bg: rgba(57, 135, 229, 0.18);
      --good: #3cc43c; --good-bg: rgba(12, 163, 12, 0.18); --bad: #f08080; --bad-bg: rgba(208, 59, 59, 0.22);
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1160px; margin: 0 auto; padding: 36px 16px 56px; }
  h1 { font-size: 24px; line-height: 1.2; margin: 0; }
  .sub { color: var(--ink-2); margin: 6px 0 24px; max-width: 72ch; }

  /* Tabs: Results, Examples, Datasets (the open tab is in the URL hash) */
  .tabs { display: flex; gap: 4px; margin: 0 0 28px; box-shadow: inset 0 -1px 0 var(--line); }
  .tab { font: inherit; font-weight: 600; color: var(--ink-2); background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 14px; cursor: pointer; white-space: nowrap; }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 6px 6px 0 0; }
  .panel:focus-visible { outline: 2px solid var(--accent); outline-offset: 6px; border-radius: 4px; }
  .panel > h2:first-child { margin-top: 0; }

  /* Summary tiles */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .tile.active { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .tile .label { color: var(--ink-2); font-size: 12px; }
  .tile .value { font-size: 24px; font-weight: 600; margin-top: 2px; }
  .tile .note { color: var(--muted); font-size: 12px; }

  /* Controls */
  .toolbar { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; margin-bottom: 12px; }
  .control { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--ink-2); max-width: 100%; }
  select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; max-width: 100%; }
  .seg { display: inline-flex; flex-wrap: wrap; max-width: 100%; background: var(--chip); border-radius: 9px; padding: 3px; gap: 2px; }
  .seg button { font: inherit; color: var(--ink-2); background: none; border: 0; border-radius: 7px; padding: 5px 12px; cursor: pointer; white-space: nowrap; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12); }
  .hint { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
  .hint .ok-hint { color: var(--good); }

  /* Table */
  .table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow-x: auto; }
  table { width: 100%; min-width: 880px; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; font-weight: 600; color: var(--ink-2); padding: 12px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th small { display: block; font-weight: 400; color: var(--muted); }
  td { padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tbody tr.clip:hover { background: var(--hover); }
  tr.detail td { background: var(--page); padding: 14px 20px 18px 74px; }
  tr:last-child td { border-bottom: 0; }

  .badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
  .badge.good { color: var(--good); background: var(--good-bg); }
  .badge.bad { color: var(--bad); background: var(--bad-bg); }

  .clip-cell { display: flex; align-items: center; gap: 12px; min-width: 220px; }
  .play { flex: none; width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--ink); color: var(--surface); display: grid; place-items: center; cursor: pointer; }
  .play svg { width: 14px; height: 14px; fill: currentColor; }
  .file { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .meta { color: var(--muted); font-size: 12px; }
  .progress { height: 2px; border-radius: 1px; margin-top: 4px; overflow: hidden; }
  .progress i { display: block; height: 100%; width: 0; background: var(--accent); }

  .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--chip); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  .chip.pred { background: var(--accent-bg); font-weight: 600; }
  .chip .ok { color: var(--good); font-weight: 700; }
  .conf { display: flex; align-items: center; gap: 8px; }
  .conf .bar { width: 72px; height: 6px; background: var(--track); border-radius: 0 3px 3px 0; }
  .conf .bar i { display: block; height: 100%; background: var(--accent); border-radius: 0 3px 3px 0; }
  .num { font-variant-numeric: tabular-nums; color: var(--ink-2); font-size: 12.5px; min-width: 3.4em; text-align: right; }
  .more { font: inherit; background: none; border: 1px solid var(--line); border-radius: 8px; color: var(--ink-2); width: 30px; height: 30px; cursor: pointer; }
  .more { display: grid; place-items: center; }
  .more svg { width: 14px; height: 14px; fill: currentColor; transition: transform 0.15s; }
  .more[aria-expanded="true"] { background: var(--chip); color: var(--ink); }
  .more[aria-expanded="true"] svg { transform: rotate(180deg); }

  /* Probability details */
  .probs { display: grid; grid-template-columns: max-content minmax(160px, 360px) 3.6em; gap: 5px 12px; align-items: center; font-size: 12.5px; color: var(--ink-2); }
  .probs .track { height: 8px; background: var(--track); border-radius: 0 4px 4px 0; }
  .probs .fill { height: 100%; background: #c3c2b7; border-radius: 0 4px 4px 0; }
  .probs .fill.pred { background: var(--accent); }
  .probs .rest, .detail .extra { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
  .detail .extra { margin-top: 10px; }

  .empty { color: var(--ink-2); padding: 28px; text-align: center; }

  /* Results: summary tables, confusion-matrix figure, datasets */
  h2 { font-size: 18px; line-height: 1.3; margin: 40px 0 4px; }
  h3 { font-size: 15px; margin: 28px 0 8px; }
  table.results { min-width: 760px; }
  .results th, .results td { padding: 10px 14px; }
  .results th { white-space: normal; vertical-align: bottom; }
  .results .n { text-align: right; font-variant-numeric: tabular-nums; }
  .results td.n { white-space: nowrap; }
  .results td.name { font-weight: 600; white-space: nowrap; }
  /* The dataset column stays in view while a wide table scrolls inside its card (phones) */
  .results td.name, .results th:first-child { position: sticky; left: 0; z-index: 1; background: var(--surface); }
  .results .labels { min-width: 15em; }
  .results th.training { min-width: 8.5em; }
  .results tr.linked { cursor: pointer; }
  .results tr.linked:hover, .results tr.linked:hover td.name { background: linear-gradient(var(--hover), var(--hover)) var(--surface); }
  .results tr.linked td.name::after { content: " ›"; color: var(--accent); }
  .results a { color: var(--accent); }
  .results tr.linked td.name a { color: inherit; text-decoration: none; }
  .results tr.linked:hover td.name a { text-decoration: underline; }
  .results a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
  .notes { color: var(--ink-2); font-size: 12.5px; margin: 10px 0 0; padding-left: 18px; max-width: 92ch; }
  .notes li { margin: 3px 0; }
  .figure { margin: 0; background: #fcfcfb; border: 1px solid var(--line); border-radius: 12px; padding: 12px; overflow: auto; }
  .figure img { display: block; width: 100%; height: auto; cursor: zoom-in; }
  .figure.zoomed img { width: auto; max-width: none; cursor: zoom-out; }
  .caption { color: var(--ink-2); font-size: 12.5px; margin: 8px 0 0; max-width: 92ch; }
  footer { color: var(--muted); font-size: 12px; margin-top: 24px; }
  code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
</style>
</head>
<body>
<main>
  <h1>Emotion recognition: results and examples</h1>
  <p class="sub" id="intro"></p>
  <div class="tabs" id="tabs" role="tablist" aria-label="Sections of this page">
    <button class="tab" id="tab-results" type="button" role="tab" aria-controls="panel-results" aria-selected="true">Results</button>
    <button class="tab" id="tab-examples" type="button" role="tab" aria-controls="panel-examples" aria-selected="false" tabindex="-1">Examples</button>
    <button class="tab" id="tab-datasets" type="button" role="tab" aria-controls="panel-datasets" aria-selected="false" tabindex="-1">Datasets</button>
  </div>
  <section class="panel" id="panel-results" role="tabpanel" aria-labelledby="tab-results" tabindex="0"></section>
  <section class="panel" id="panel-examples" role="tabpanel" aria-labelledby="tab-examples" tabindex="0" hidden>
  <h2>Examples</h2>
  <p class="sub" id="sub"></p>
  <div class="tiles" id="tiles"></div>
  <div class="toolbar">
    <label class="control" id="run-control">Dataset and model <select id="run"></select></label>
    <div class="control" id="criterion-control">Correct when the prediction matches <div class="seg" id="criterion" role="group"></div></div>
    <div class="control">Show <div class="seg" id="status" role="group"></div></div>
    <label class="control"><span id="truth-label">Ground truth</span> <select id="emotion"></select></label>
  </div>
  <p class="hint">Press play to listen. <b class="ok-hint">✓</b> marks the labels the prediction matches. The arrow at the end of a row shows all of the model's probabilities.</p>
  <div class="table-wrap"><table>
    <thead><tr id="head"></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
  </section>
  <section class="panel" id="panel-datasets" role="tabpanel" aria-labelledby="tab-datasets" tabindex="0" hidden></section>
  <footer id="footer"></footer>
</main>

<script id="data" type="application/json">__DATA__</script>
<script>
  const DATA = JSON.parse(document.getElementById("data").textContent);
  const state = { run: 0, criterion: null, status: "all", emotion: "all" };
  const $ = (id) => document.getElementById(id);
  const pretty = (key) => key.replace(/_/g, " ").replace(/^./, (c) => c.toUpperCase());
  const percent = (p) => `${(100 * p).toFixed(p >= 0.995 || p < 0.005 ? 0 : 1)}%`;
  // "a or b" is a tie; a composite label such as excited also matches the classes it accepts (accept: run.accept)
  const matches = (value, prediction, accept = {}) =>
    value.split(" or ").some((v) => v === prediction || (accept[v] ?? []).includes(prediction));
  const ICONS = { play: "M5 3.2v9.6L12.8 8z", pause: "M4 3h3v10H4zM9 3h3v10H9z", chevron: "M3.5 6l4.5 4.5L12.5 6l-1-1-3.5 3.5L4.5 5z" };

  // Create an element with properties and children; data is always inserted as text, never as HTML
  function el(tag, props = {}, ...children) {
    const node = Object.assign(document.createElement(tag), props);
    node.append(...children.filter((c) => c !== null && c !== undefined && c !== false));
    return node;
  }
  function icon(name) {
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 16 16");
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", ICONS[name]);
    svg.append(path);
    return svg;
  }

  // One shared audio player; each row's button plays its clip
  const player = new Audio();
  let current = null;  // { button, bar } of the clip that is loaded
  function play(src, button, bar) {
    if (current?.button === button) { player.paused ? player.play() : player.pause(); return; }
    if (current) { current.button.replaceChildren(icon("play")); current.bar.style.width = "0"; }
    current = { button, bar };
    player.src = src;
    player.play();
  }
  player.addEventListener("play", () => current?.button.replaceChildren(icon("pause")));
  player.addEventListener("pause", () => current?.button.replaceChildren(icon("play")));
  player.addEventListener("timeupdate", () => { if (current && player.duration) current.bar.style.width = `${100 * player.currentTime / player.duration}%`; });

  function segmented(container, options, active, onPick) {
    container.replaceChildren(...options.map(([value, text]) => {
      const b = el("button", { type: "button", textContent: text, onclick: () => onPick(value) });
      b.setAttribute("aria-pressed", String(value === active));
      return b;
    }));
  }

  function probabilities(ex, run) {
    const truth = ex.labels[run.ground_truth];
    const accepted = run.accept?.[truth] ?? [];  // the classes a composite ground truth such as excited accepts
    const sorted = Object.entries(ex.probs).sort((a, b) => b[1] - a[1]);
    const keep = sorted.filter(([name, p]) => p >= 0.01 || name === truth || accepted.includes(name) || name === ex.labels.prediction);
    const grid = el("div", { className: "probs" });
    for (const [name, p] of keep) {
      grid.append(
        el("span", { textContent: name === truth ? `${name} (ground truth)` : accepted.includes(name) ? `${name} (accepted for ${truth})` : name }),
        el("div", { className: "track" }, el("div", { className: `fill${name === ex.labels.prediction ? " pred" : ""}`, style: `width: ${100 * p}%` })),
        el("span", { className: "num", textContent: percent(p) }));
    }
    if (sorted.length > keep.length) grid.append(el("span", { className: "rest", textContent: `${sorted.length - keep.length} other classes below 1%` }));
    return grid;
  }

  function rows(ex, run, labelKeys) {
    const ok = ex.correct[state.criterion];
    const button = el("button", { className: "play", type: "button", title: "Play or pause" }, icon("play"));
    const bar = el("i");
    button.addEventListener("click", () => play(ex.audio, button, bar));
    const prediction = ex.labels.prediction;
    // The prediction is the most probable of the dataset's emotions; the model's overall top class may differ
    const top9 = Object.entries(ex.labels).find(([k]) => k !== "prediction" && k.startsWith("prediction"))?.[1];
    const p = ex.probs[prediction];
    const toggle = el("button", { className: "more", type: "button", title: "Show all probabilities" }, icon("chevron"));
    toggle.setAttribute("aria-expanded", "false");

    const tr = el("tr", { className: "clip" },
      el("td", {}, el("span", { className: `badge ${ok ? "good" : "bad"}`, textContent: ok ? "✓ Correct" : "✗ Wrong" })),
      el("td", {}, el("div", { className: "clip-cell" }, button,
        el("div", {}, el("div", { className: "file", textContent: ex.file }),
          el("div", { className: "meta", textContent: ex.duration ? `${ex.duration.toFixed(1)} s` : "" }),
          el("div", { className: "progress" }, bar)))),
      ...labelKeys.map((key) => el("td", {}, ex.labels[key]
        ? el("span", { className: "chip" }, ex.labels[key], matches(ex.labels[key], prediction, run.accept) ? el("span", { className: "ok", textContent: "✓", title: "the prediction matches this label" }) : null)
        : el("span", { className: "meta", textContent: "–" }))),
      el("td", {}, el("span", { className: "chip pred", textContent: prediction })),
      el("td", {}, p === undefined ? null : el("div", { className: "conf" },
        el("div", { className: "bar" }, el("i", { style: `width: ${100 * p}%` })), el("span", { className: "num", textContent: percent(p) })),
        top9 && top9 !== prediction ? el("div", { className: "meta", textContent: `top of all classes: ${top9}` }) : null),
      el("td", {}, Object.keys(ex.probs).length ? toggle : null));

    // Hidden detail row with every probability (and any secondary prediction that differs)
    const others = Object.entries(ex.labels).filter(([k, v]) => k !== "prediction" && k.startsWith("prediction") && v && v !== prediction);
    const detail = el("tr", { className: "detail", hidden: true },
      el("td", { colSpan: labelKeys.length + 5 }, probabilities(ex, run),
        ...others.map(([k, v]) => el("div", { className: "extra", textContent: `${pretty(k)}: ${v}` }))));
    toggle.addEventListener("click", () => {
      detail.hidden = !detail.hidden;
      toggle.setAttribute("aria-expanded", String(!detail.hidden));
    });
    return [tr, detail];
  }

  function render() {
    player.pause();
    current = null;
    const run = DATA.runs[state.run];
    const examples = run.examples;
    const isRight = (ex) => ex.correct[state.criterion];
    const shownRight = examples.filter(isRight).length;

    $("sub").textContent = `Random clips that ${run.model} got right and wrong on ${run.dataset}. Listen to each clip and compare its labels with the model's prediction.`;
    $("tiles").replaceChildren(
      ...run.criteria.map((c) => el("div", { className: `tile${c.column === state.criterion ? " active" : ""}` },
        el("div", { className: "label", textContent: `Accuracy: matches the ${c.name}` }),
        el("div", { className: "value", textContent: `${(100 * c.accuracy).toFixed(1)}%` }),
        el("div", { className: "note", textContent: run.total_clips > run.total
          ? `on a sample of ${run.total.toLocaleString()} of its ${run.total_clips.toLocaleString()} clips`
          : `on all ${run.total.toLocaleString()} clips` }))),
      el("div", { className: "tile" },
        el("div", { className: "label", textContent: "Clips on this page" }),
        el("div", { className: "value", textContent: String(examples.length) }),
        el("div", { className: "note", textContent: `${shownRight} correct, ${examples.length - shownRight} wrong` })));

    const criteriaShown = run.criteria.length > 1;
    $("criterion-control").hidden = !criteriaShown;
    if (criteriaShown) segmented($("criterion"), run.criteria.map((c) => [c.column, pretty(c.name)]), state.criterion,
      (v) => { state.criterion = v; render(); });
    segmented($("status"), [["all", `All ${examples.length}`], ["correct", `✓ Correct ${shownRight}`], ["wrong", `✗ Wrong ${examples.length - shownRight}`]],
      state.status, (v) => { state.status = v; render(); });

    // Columns: result, clip, the ground truth and other labels, prediction, confidence, details
    const labelKeys = [run.ground_truth, ...Object.keys(examples[0]?.labels ?? {}).filter((k) => k !== run.ground_truth && !k.startsWith("prediction"))];
    const describe = (key) => run.columns?.[key] ?? "";
    $("head").replaceChildren(
      el("th", { textContent: "Result" }), el("th", { textContent: "Clip" }),
      ...labelKeys.map((key) => el("th", { title: describe(key) }, pretty(key), key === run.ground_truth ? el("small", { textContent: "ground truth" }) : null)),
      el("th", { title: describe("prediction"), textContent: "Prediction" }),
      el("th", { textContent: "Confidence" }), el("th", {}));

    const shown = examples.filter((ex) =>
      (state.status === "all" || (state.status === "correct") === isRight(ex)) &&
      (state.emotion === "all" || ex.labels[run.ground_truth] === state.emotion));
    $("rows").replaceChildren(...(shown.length ? shown.flatMap((ex) => rows(ex, run, labelKeys))
      : [el("tr", {}, el("td", { className: "empty", colSpan: labelKeys.length + 5, textContent: "No clips match these filters." }))]));
  }

  // ---- Results: one summary per model (from reports/<model>_summary.json) and the datasets' sources ----
  const pct = (x) => (x === null || x === undefined) ? "–" : `${(100 * x).toFixed(1)}%`;
  const sampleOf = (d) => d.total_clips > d.clips ? ` of ${d.total_clips.toLocaleString()}` : "";
  // Ground-truth labels in the order of the confusion-matrix rows; a composite label names the classes it accepts
  const labelText = (d) => d.labels?.length ? d.labels.map((x) => d.accept?.[x] ? `${x} (${d.accept[x].join(" or ")})` : x).join(", ") : "–";
  const TRAINING = "In emotion2vec+ training data (EmoBox)";
  function resultsTable(columns, rows) {  // columns: [heading, class ("n": numeric)]; rows: <tr> elements
    return el("div", { className: "table-wrap" }, el("table", { className: "results" },
      el("thead", {}, el("tr", {}, ...columns.map(([text, cls]) => el("th", { className: cls ?? "", textContent: text })))),
      el("tbody", {}, ...rows)));
  }
  // A row whose dataset opens its example clips in the Examples tab, if the page has them: the name is a link
  // (#examples, reachable with the keyboard) and the whole row can be clicked
  function datasetRow(d, model, cells) {
    const index = DATA.runs.findIndex((r) => r.key === d.key && r.model === model);
    const name = el("td", { className: "name" }, index >= 0 ? el("a", { href: "#examples", textContent: d.dataset }) : d.dataset);
    const tr = el("tr", { className: index >= 0 ? "linked" : "", title: index >= 0 ? `Listen to example clips of ${d.dataset}` : "No example clips of this dataset on this page" }, name, ...cells);
    if (index >= 0) tr.addEventListener("click", (e) => {
      e.preventDefault();  // the link's own navigation; openTab sets the hash
      $("run").value = String(index);
      selectRun(index);
      openTab("examples");
      $("tab-examples").focus({ preventScroll: true });
    });
    return tr;
  }
  const td = (text, cls) => el("td", { className: cls ?? "", textContent: text });

  function renderSummary(s) {
    const listeners = s.datasets.some((d) => d.metrics.accuracy_acted_or_listener !== undefined);
    // Composite labels, e.g. "JL-Corpus's excited (happy or surprised)"
    const composite = s.datasets.flatMap((d) => Object.entries(d.accept ?? {}).map(([label, classes]) => `${d.dataset}'s ${label} (${classes.join(" or ")})`));
    const byKey = Object.fromEntries(s.datasets.map((d) => [d.key, d]));
    const main = resultsTable(
      [["Dataset"], ["Language"], ["Ground-truth labels", "labels"], [TRAINING, "training"], ["Clips", "n"], ["Emotions", "n"], ["Chance", "n"],
       ["Accuracy: acted emotion", "n"], ...(listeners ? [["Accuracy: acted or listeners' vote", "n"]] : []), ["Unweighted accuracy", "n"], ["Macro F1", "n"]],
      s.datasets.map((d) => datasetRow(d, s.model, [
        td(d.language), td(labelText(d), "labels"), td(d.in_emobox ? "yes" : "no"), td(d.clips.toLocaleString() + sampleOf(d), "n"),
        td(String(d.emotions), "n"), td(pct(d.chance ?? 1 / d.emotions), "n"), el("td", { className: "n" }, el("b", { textContent: pct(d.metrics.accuracy) })),
        ...(listeners ? [td(pct(d.metrics.accuracy_acted_or_listener), "n")] : []), td(pct(d.metrics.unweighted_accuracy), "n"),
        td(pct(d.metrics.macro_f1), "n")])));
    const notes = el("ul", { className: "notes" },
      el("li", { textContent: "Ground-truth labels: the emotions the speakers were asked to portray, named after emotion2vec+'s classes, in the order of the rows of the confusion matrices." }),
      composite.length ? el("li", { textContent: `Composite labels (no model class; a prediction of any class in brackets counts as correct): ${composite.join(", ")}. Chance level counts these classes, so it is higher than 1 in the number of emotions.` }) : null,
      el("li", { textContent: `${TRAINING}: yes means that the dataset is in EmoBox, whose data fine-tuned emotion2vec+ seed, the first model in the chain that led to emotion2vec+ large; the model has probably seen these clips, so the result is optimistic. No: not in EmoBox, although earlier exposure cannot be ruled out completely.` }),
      el("li", { textContent: "Accuracy: acted emotion compares the prediction with the emotion the speaker was asked to portray. The prediction is the most probable of the emotions that the dataset has, so chance level depends on how many emotions it has." }),
      listeners ? el("li", { textContent: "Accuracy: acted or listeners' vote also accepts the listeners' majority vote; only datasets that publish listeners' labels have it." }) : null,
      s.datasets.some((d) => d.total_clips > d.clips) ? el("li", { textContent: "Clips such as 3,500 of 35,000: evaluated on a sample taken at even intervals within each emotion, not on every clip." }) : null,
      el("li", { textContent: "Click a dataset to listen to its example clips in the Examples tab (› marks the datasets with clips on this page)." }));
    const parts = [el("h2", { textContent: `Results of ${s.model} on every dataset` }),
      el("p", { className: "sub", textContent: `${s.datasets.length} datasets, summary of ${s.date}. One prediction per clip, the model as released (no fine-tuning).` }),
      main, notes];
    if (s.figure) {
      const figure = el("figure", { className: "figure" }, el("img", { src: s.figure, alt: `Confusion matrices of ${s.model} on every dataset` }));
      figure.addEventListener("click", () => figure.classList.toggle("zoomed"));
      parts.push(el("h3", { textContent: "Confusion matrices" }), figure, el("p", { className: "caption", textContent:
        `One matrix per dataset: ${s.figure_datasets.join(", ")}. Rows: acted emotion; columns: predicted emotion; each row adds up to 100%.`
        + (s.acted_or_listener.length ? ` ${s.acted_or_listener.join(", ")}: a prediction also counts as correct when it matches the listeners' vote, and such a clip sits in the row of that vote.` : "")
        + (composite.length ? " A composite label has its own row, whose bold cells count as correct." : "")
        + " Click the figure to enlarge it." }));
    }
    if (s.shared.length) {
      const n = s.shared_emotions.length;
      parts.push(el("h3", { textContent: `Only the emotions every dataset has: ${s.shared_emotions.join(", ")}` }),
        el("p", { className: "caption", textContent: `The datasets have different emotions, and some are much harder than others. Here every dataset is scored on the same ${n} emotions (chance ${pct(1 / n)}): clips of other emotions are left out, and the prediction is the most probable of these ${n}.` }),
        resultsTable([["Dataset"], ["Language"], ["Ground-truth labels", "labels"], [TRAINING, "training"], ["Clips", "n"], ["Accuracy", "n"], ["Unweighted accuracy", "n"]],
          s.shared.map((d) => datasetRow(d, s.model, [td(d.language), td(labelText(byKey[d.key] ?? d), "labels"), td(d.in_emobox ? "yes" : "no"),
            td(d.clips.toLocaleString() + (d.sample ? " (sample)" : ""), "n"), el("td", { className: "n" }, el("b", { textContent: pct(d.accuracy) })),
            td(pct(d.unweighted_accuracy), "n")]))));
    }
    return parts;
  }

  function renderDatasets() {
    const names = Object.fromEntries([...DATA.summaries.flatMap((s) => s.datasets), ...DATA.runs].map((d) => [d.key, d.dataset]));
    const keys = Object.keys(DATA.sources);
    if (!keys.length) return [];
    const link = (text, href) => href ? el("a", { href, textContent: text, target: "_blank", rel: "noopener" }) : text;
    return [el("h2", { textContent: "Datasets and licences" }),
      el("p", { className: "sub", textContent: "Where each dataset comes from, its licence and the credit its authors ask for. A dataset's clips are on this page only if its licence allows it." }),
      resultsTable([["Dataset"], ["Licence"], ["Credit"], ["Clips on this page"]], keys.map((key) => {
        const src = DATA.sources[key];
        const shown = DATA.runs.some((r) => r.key === key);
        return el("tr", {}, el("td", { className: "name" }, link(names[key] ?? key, src.url)), el("td", {}, link(src.licence, src.licence_url)),
          el("td", { textContent: src.credit }),
          td(shown ? "yes" : (src.public_audio ? "no, results only" : "no: its licence does not allow sharing its audio; results only")));
      }))];
  }

  function selectRun(index) {
    const run = DATA.runs[index];
    Object.assign(state, { run: index, criterion: run.criteria[0].column, status: "all", emotion: "all" });
    $("truth-label").textContent = pretty(run.ground_truth);
    const emotions = [...new Set(run.examples.map((ex) => ex.labels[run.ground_truth]))].sort();
    $("emotion").replaceChildren(el("option", { value: "all", textContent: "all" }), ...emotions.map((e) => el("option", { value: e, textContent: e })));
    render();
  }

  // ---- Tabs: the open tab is in the URL hash (#results, #examples, #datasets), so a tab can be linked and the
  // browser's back button returns to the previous tab ----
  const TABS = ["results", "examples", "datasets"];
  const shownTabs = () => TABS.filter((t) => !$(`tab-${t}`).hidden);
  const tabInHash = () => shownTabs().includes(location.hash.slice(1)) ? location.hash.slice(1) : "results";
  function showTab(name) {
    for (const t of TABS) {
      $(`tab-${t}`).setAttribute("aria-selected", String(t === name));
      $(`tab-${t}`).tabIndex = t === name ? 0 : -1;  // only the open tab is in the Tab order; arrow keys move between tabs
      $(`panel-${t}`).hidden = t !== name;
    }
    if (name !== "examples") player.pause();
  }
  function openTab(name) {  // a user's choice: a new history entry, and the tabs scrolled into view if above the window
    showTab(name);
    if (location.hash !== `#${name}`) location.hash = name;
    if ($("tabs").getBoundingClientRect().top < 0) $("tabs").scrollIntoView();
  }
  window.addEventListener("hashchange", () => showTab(tabInHash()));
  for (const t of TABS) $(`tab-${t}`).addEventListener("click", () => openTab(t));
  $("tabs").addEventListener("keydown", (e) => {
    const tabs = shownTabs(), k = tabs.indexOf(e.target.id.replace("tab-", ""));
    const next = { ArrowLeft: k - 1, ArrowRight: k + 1, Home: 0, End: tabs.length - 1 }[e.key];
    if (k < 0 || next === undefined) return;
    e.preventDefault();
    const name = tabs[(next + tabs.length) % tabs.length];
    openTab(name);
    $(`tab-${name}`).focus();
  });

  const models = [...new Set([...DATA.summaries.map((s) => s.model), ...DATA.runs.map((r) => r.model)])];
  $("intro").textContent = `Speech emotion recognition with ${models.join(", ")}: the results on every evaluated dataset, random clips it got right and wrong, and where the datasets come from.`;
  $("panel-results").replaceChildren(...(DATA.summaries.length ? DATA.summaries.flatMap(renderSummary)
    : [el("p", { className: "empty", textContent: "No results yet: run scripts/emotion2vec/evaluate.py, then this script again." })]));
  $("panel-datasets").replaceChildren(...renderDatasets());
  $("run").replaceChildren(...DATA.runs.map((r, i) => el("option", { value: i, textContent: `${r.dataset} / ${r.model}` })));
  $("run-control").hidden = DATA.runs.length < 2;
  $("run").addEventListener("change", (e) => selectRun(Number(e.target.value)));
  $("emotion").addEventListener("change", (e) => { state.emotion = e.target.value; render(); });
  $("footer").append("Generated by ", el("code", { textContent: "scripts/viewer/make_viewer.py" }),
    ". To get the same clips again, set ", el("code", { textContent: `viewer.seed: ${DATA.seed}` }), " in ",
    el("code", { textContent: "config/config.yaml" }), ".");
  $("tab-examples").hidden = !DATA.runs.length;
  $("tab-datasets").hidden = !Object.keys(DATA.sources).length;
  if (DATA.runs.length) selectRun(0);
  showTab(tabInHash());
</script>
</body>
</html>
