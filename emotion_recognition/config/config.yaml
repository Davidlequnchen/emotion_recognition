# =====================================================================
# Project configuration. Every script reads its settings from this file
# (there are no command-line options): edit a value, then run
# `python scripts/<group>/<name>.py` from the emotion_recognition/ folder.
# Paths in this file are relative to that folder.
# =====================================================================

# Hardware mode
#   mac  : Apple Silicon MacBook (e.g. M4 Max) -> Apple GPU via Metal (MPS), or CPU
#   cuda : Linux server with NVIDIA GPU(s)     -> CUDA 12.1 build of PyTorch
mode: mac

# Device of scripts/emotion2vec/inference.py in each mode. Set it to "cpu" to force the CPU.
devices:
  mac: mps        # mps | cpu
  cuda: cuda:0    # cuda:<gpu index> | cpu

# Model of scripts/emotion2vec/inference.py: an emotion2vec model, one of the keys under `models`
model: emotion2vec_plus_large

# ---------------------------------------------------------------------
# Model registry: one entry here and one sub-folder in models/ per model.
#   name            : display name in the reports and on the results page
#   loader          : the code that runs it, scripts/models/<loader>.py
#   dir             : where its files are
#   hf_repo         : the Hugging Face repository it comes from (ms_repo: ModelScope, if it is there too)
#   training_data   : the evaluation datasets it was trained on, so its results there are optimistic
#   training_source : what its training data was, in a few words (shown next to training_data)
#   mac_device      : (optional) its device on the Mac, when it differs from evaluation.devices.mac
# ---------------------------------------------------------------------
models:
  emotion2vec_plus_large:
    name: emotion2vec+ large
    loader: emotion2vec
    dir: models/emotion2vec_plus_large
    hf_repo: emotion2vec/emotion2vec_plus_large
    ms_repo: iic/emotion2vec_plus_large
    training_data: [crema_d, ravdess, tess, jl_corpus, esd]
    training_source: EmoBox (through emotion2vec+ seed)
    mac_device: cpu   # MPS compiles new kernels for every new clip length, so the CPU is faster
  meralion_ser_v1:
    name: MERaLiON-SER-v1
    loader: meralion_ser
    dir: models/meralion_ser_v1
    hf_repo: MERaLiON/MERaLiON-SER-v1
    training_data: [crema_d, esd]
    training_source: CREMA-D, ESD, MELD, M3ED and Singaporean speech
  melati_emotion:
    name: Melati
    loader: melati
    dir: models/melati_emotion
    hf_repo: Scicom-intl/Melati-Emotion-Whisper-Large-V3
    training_data: [jl_corpus]
    training_source: nine acted corpora, JL-Corpus among them
  vox_profile_whisper:
    name: Vox-Profile Whisper
    loader: vox_profile
    dir: models/vox_profile_whisper
    hf_repo: tiantiaf/whisper-large-v3-msp-podcast-emotion
    training_data: []
    training_source: MSP-Podcast
  vox_profile_wavlm:
    name: Vox-Profile WavLM
    loader: vox_profile
    dir: models/vox_profile_wavlm
    hf_repo: tiantiaf/wavlm-large-categorical-emotion
    training_data: []
    training_source: MSP-Podcast

# ---------------------------------------------------------------------
# scripts/common/download_model.py and scripts/common/download_data.py
# ---------------------------------------------------------------------
download:
  models: all       # what download_model.py gets: all registered models, or a list such as [meralion_ser_v1]
  hub: hf           # hf (Hugging Face) | ms (ModelScope, faster in mainland China; only models with an ms_repo)
  dataset: crema_d  # what download_data.py gets: crema_d | mcae_spps | thai_ser | nemo | mess | esd
                    # | ravdess | tess | jl_corpus | all
  crema_d: samples  # CREMA-D only: samples (the 6 test clips) | full (all 7,442 clips and label files)
  workers: 8        # parallel downloads

# ---------------------------------------------------------------------
# scripts/common/split_parts.py: cuts large files into parts that git can take (GitHub refuses files over
# 100 MB), for a machine that cannot download them; scripts/common/join_parts.py puts them back together there
# ---------------------------------------------------------------------
parts:
  files:            # the files to cut, each into <file>.part000, .part001, ... and <file>.sha256
    - models/meralion_ser_v1/model.safetensors
    - models/melati_emotion/model.safetensors
    - models/vox_profile_whisper/model_slim.safetensors
    - models/vox_profile_wavlm/model.safetensors
  size_mib: 90      # size of each part

# ---------------------------------------------------------------------
# scripts/emotion2vec/inference.py
# ---------------------------------------------------------------------
inference:
  audio: data/samples   # a folder (every audio file in it) or a single file

# ---------------------------------------------------------------------
# scripts/evaluation/evaluate.py: every chosen model on every chosen dataset
# ---------------------------------------------------------------------
evaluation:
  models: all       # all registered models, or a list such as [emotion2vec_plus_large, meralion_ser_v1]
  datasets: all     # all downloaded datasets, or a list such as [crema_d, ravdess]
                    # (crema_d | mcae_spps | thai_ser | nemo | mess | esd | ravdess | tess | jl_corpus)
  exclude: [esd, thai_ser, nemo]  # never evaluated, even with `all`, and left out of the summaries (old results:
                                  # reports/archive/); their data stays in data/
  limit: null       # only N clips of each dataset, taken at even intervals within each emotion (quick test or
                    # sample); null = every clip
  overwrite: false  # false: skip a model and dataset whose results (same limit) are already in outputs/<model>/;
                    # true: evaluate it again and replace them. The summaries show every result there,
                    # except those of excluded datasets
  devices:          # device per mode; a model's mac_device (in `models`) overrides the one for the Mac
    mac: mps
    cuda: cuda:0
  summary_figure:   # every dataset's confusion matrix in one figure, in each model's summary report
    order: [crema_d, mcae_spps, mess]  # panels row by row; datasets not listed come last
    acted_or_listener: [crema_d]  # these show the matrix where the listeners' vote also counts as correct;
                                  # the others show the acted emotion

# ---------------------------------------------------------------------
# scripts/viewer/make_viewer.py: a web page with the results of every model and example clips
# ---------------------------------------------------------------------
viewer:
  predictions: all  # all = every outputs/<model>/*_predictions.csv, or a list of such files
  correct: 10       # per dataset and model: how many clips it got right to add to the examples (the page shows
                    # every model's prediction for every clip added)
  wrong: 10         # per dataset and model: how many clips it got wrong to add
  seed: null        # a number gives the same selection every time; null picks new clips on each run
  link_audio: false # false = embed each clip as 16 kHz mono MP3; true = link to the audio files instead (smaller
                    # page, works only in this repo; the public page always embeds)
  out: outputs/viewer.html  # the page for this machine (not in git)
  site: site/index.html     # the public page for GitHub Pages (only clips whose licence allows it); null = none
  exclude: [esd, thai_ser, nemo]  # datasets left out of both pages: no results, no clips

# ---------------------------------------------------------------------
# scripts/llm_eval/: audio LLMs (GPT Realtime, Gemini) on the same clips and labels as the evaluation
# ---------------------------------------------------------------------
llm:
  datasets: all     # all downloaded datasets, or a list such as [crema_d, ravdess] (the names of evaluation.datasets)
  exclude: [esd, thai_ser, nemo]  # never sent to a model, even with `all` (default: the same as evaluation.exclude). A
                                  # dataset whose licence forbids giving its audio to others (ESD) is never sent anyway
  limit: 200        # N clips of each dataset, sampled as with evaluation.limit (even intervals within each emotion),
                    # to keep the API cost low; null = every clip
  audio_format: pcm16_24k  # pcm16_24k = 16-bit PCM at 24 kHz, mono (the only input of the GPT Realtime API)
                           # | wav16k = a 16 kHz mono 16-bit WAV file (for Gemini); both sent as base64
  prompts: scripts/llm_eval/prompts.yaml  # the system and user prompts and the emotions the model chooses from
  preview: 2        # python scripts/llm_eval/data_loader.py shows this many items of each dataset
