# =====================================================================
# Settings of label_studio/link_upload_audio.py: hard-link the audio files of one tasks_NNN.json into
# part_01/, part_02/, … folders for Label Studio Import → Upload Files (server Label Studio without Local Files).
# Run it from the repository root: python3 label_studio/link_upload_audio.py
# Hard links use no extra disk space; the originals stay where they are. Use absolute paths.
# =====================================================================
tasks_file: /absolute/path/to/dataset/batch/tasks/tasks_001.json  # the batch to upload
document_root: /absolute/path/to/dataset  # the root that the ?d= paths in tasks_file are relative to
upload_dir: /absolute/path/to/dataset/batch/audio/upload_001  # new or empty folder on the same disk as the
                                                              # audio (hard links cannot cross disks)
files_per_folder: 100  # files per part folder = per upload; open-source Label Studio accepts 100 files per
                       # upload by default (DATA_UPLOAD_MAX_NUMBER_FILES); a server's admin may set another limit
